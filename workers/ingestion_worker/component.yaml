apiVersion: mindclade.dev/v1
kind: Component
metadata:
  name: workers-ingestion-worker
  description: Bounded ingestion worker consuming immutable job events through the private SDK.
spec:
  type: worker
  lifecycle: pre-production
  maturity: internal
  owner: data-platform
  security_reviewers:
    - security
  repository_class: application-source
  trust_tier: workload
  recovery_tier: tier-1
  data_classification: internal
  production_authority: false
  dependencies:
    - component: internal-sdk-rust
      kind: compile-api
      visibility: repository
      owner: developer-experience
      justification: The worker uses the governed ergonomic Rust facade over generated transports.
      scope: assignment retrieval and verified artifact access
    - component: protobuf-job-events
      kind: protocol
      visibility: repository
      owner: architecture
      justification: Immutable typed job events are the authoritative assignment-delivery contract.
      scope: Pub/Sub assignment intake
  provides:
    - verified-ingestion-assignment-intake
  release:
    strategy: source-only
    artifact: null
    immutable: false
  activation:
    wave: guide-only
    connected: false
status:
  readiness: IMPLEMENTED
  source_readiness: SOURCE_IMPLEMENTED
