[workspace]
members = [
    "protocols/generated/rust",
    "libs/rust/artifact",
    "libs/rust/bytes",
    "libs/rust/config",
    "libs/rust/errors",
    "libs/rust/identifiers",
    "libs/rust/observability",
    "libs/rust/retry",
    "libs/rust/storage",
    "libs/rust/testing",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "LicenseRef-Mindclade-Proprietary"
repository = "https://github.com/mindclade/mindclade"
rust-version = "1.97.1"

[workspace.dependencies]
protobuf = "=3.7.2"
protobuf-codegen = "=3.7.2"
serde = "1.0.228"
serde_json = "1.0.149"
sha2 = "0.10.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
