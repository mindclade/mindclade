[workspace]
members = [
    "tools/codegen/rust_plugins",
    "protocols/generated/rust",
    "libs/rust/artifact",
    "libs/rust/bytes",
    "libs/rust/config",
    "libs/rust/errors",
    "libs/rust/identifiers",
    "libs/rust/observability",
    "libs/rust/retry",
    "libs/rust/storage",
    "libs/rust/testing",
    "internal/sdk/rust",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "LicenseRef-Mindclade-Proprietary"
repository = "https://github.com/mindclade/mindclade"
rust-version = "1.97.1"

[workspace.dependencies]
jsonschema = { version = "=0.52.1", default-features = false }
prost = "=0.14.4"
prost-types = "=0.14.4"
protoc-gen-prost = "=0.5.0"
protoc-gen-tonic = "=0.5.0"
serde = "1.0.228"
serde_json = "1.0.149"
sha2 = "0.11.0"
tokio = "=1.53.1"
tonic = { version = "=0.14.6", features = ["transport"] }
tonic-prost = "=0.14.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
