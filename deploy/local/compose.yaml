name: mindclade-wave1

services:
  postgres:
    image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_DB: mindclade
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
      POSTGRES_USER: mindclade
    ports:
      - 127.0.0.1:55432:5432
    tmpfs:
      - /var/lib/postgresql:rw,noexec,nosuid,size=512m
    healthcheck:
      test: [CMD-SHELL, pg_isready -U mindclade -d mindclade]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    restart: "no"

  migrate-control-plane:
    image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGDATABASE: mindclade
      PGHOST: postgres
      PGUSER: mindclade
    command:
      - sh
      - -ec
      - psql -v ON_ERROR_STOP=1 -f /migrations/000001_kernel.up.sql
    volumes:
      - ../../services/control_plane/migrations/000001_kernel.up.sql:/migrations/000001_kernel.up.sql:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: "no"
