version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  relative-path-mode: gomod

linters:
  default: standard
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - durationcheck
    - errname
    - errorlint
    - fatcontext
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - makezero
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - reassign
    - recvcheck
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - usestdlibvars
    - wastedassign
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
  exclusions:
    generated: strict
    warn-unused: true
    rules:
      - linters:
          - errname
        path: libs/go/faults/classification\.go
        text: "error type name `Fault`"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mindclade/mindclade
  exclusions:
    generated: strict
    warn-unused: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
