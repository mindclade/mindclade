apiVersion: mindclade.dev/v1
kind: Component
metadata:
  name: mindclade
  description: Canonical public product-source monorepo for Mindclade contracts and immutable build inputs.
  annotations:
    github.com/project-slug: mindclade/mindclade
    mindclade.dev/module-identity: github.com/mindclade/mindclade
    mindclade.dev/security-owner: security
spec:
  type: product-source-monorepo
  lifecycle: pre-production
  maturity: internal
  owner: product-engineering
  security_reviewers:
    - security
  repository_class: application-source
  trust_tier: founder-bootstrap-source
  recovery_tier: tier-0
  data_classification: public
  production_authority: false
  dependencies: []
  provides:
    - repository-drift-v1
    - repository-path-manifest-v1
    - architecture-blueprint-v3
    - immutable-product-build-source
    - contract-kernel-v1
    - durability-kernel-v1
    - release-manifest-v1
  release:
    strategy: protected-build-once
    artifact: signed-release-manifest
    immutable: true
    promotion: digest-only
  activation:
    source_ready:
      description: Wave 0 source, ownership, build, and evidence checks pass at an exact protected revision.
    founder_bootstrap:
      description: ADR-0008 and FBE-0001 permit Wave 1 source work only; connected and production authority remain false.
    connected:
      description: Repository-level branch protection, independent review, trusted Buildkite, signing, and recovery evidence are verified at that revision.
status:
  readiness: FOUNDER_BOOTSTRAPPED
