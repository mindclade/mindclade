{
  "version": "v2",
  "clean": true,
  "plugins": [
    {
      "local": ["go", "tool", "protoc-gen-go"],
      "out": ".mindclade-codegen/go",
      "opt": ["paths=source_relative"],
      "strategy": "all"
    },
    {
      "protoc_builtin": "python",
      "protoc_path": "protoc",
      "out": ".mindclade-codegen/python",
      "strategy": "all"
    },
    {
      "local": "protoc-gen-rs",
      "out": ".mindclade-codegen/rust",
      "strategy": "all"
    },
    {
      "local": ["pnpm", "exec", "protoc-gen-es"],
      "out": ".mindclade-codegen/typescript",
      "opt": ["target=ts", "import_extension=js"],
      "strategy": "all"
    }
  ]
}
