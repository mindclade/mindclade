[package]
name = "mindclade-internal-sdk"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
mindclade-protocols = { path = "../../protocols/generated/rust" }
prost.workspace = true
prost-types.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "rt", "sync", "time"] }
tonic = { workspace = true, features = ["tls-ring", "tls-webpki-roots"] }

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
