apiVersion: mindclade.dev/v1
kind: Component
metadata:
  name: internal-sdk-rust
  description: Private ergonomic Rust facade over the generated internal Prost and Tonic contracts.
spec:
  type: internal-sdk
  lifecycle: pre-production
  maturity: internal
  owner: developer-experience
  security_reviewers:
    - security
  repository_class: application-source
  trust_tier: client
  recovery_tier: rebuildable
  data_classification: internal
  production_authority: false
  dependencies: []
  provides:
    - internal-rust-sdk
  release:
    strategy: source-only
    artifact: null
    immutable: false
  activation:
    wave: "1"
    connected: false
status:
  readiness: IMPLEMENTED
  source_readiness: SOURCE_IMPLEMENTED
