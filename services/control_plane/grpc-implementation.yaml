    receiver: Server
    sources:
      - services/control_plane/internal/datasets/server.go
  mindclade.internal.evaluation.v1.EvaluationService:
    owner: control-plane/evaluations
    receiver: Server
    sources:
      - services/control_plane/internal/evaluations/server.go
  mindclade.internal.experiment.v1.ExperimentService:
    owner: control-plane/experiments
    receiver: Server
    sources:
