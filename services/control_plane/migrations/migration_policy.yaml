version: v1
database: postgresql
owner: platform-control-plane
policy:
  lifecycle: expand-migrate-contract
  transactional: required
  require_tenant_scope: true
  require_row_level_security: true
  direct_database_edits: prohibited
  external_side_effects_in_transactions: prohibited
  down_migrations: development-and-preproduction-only
  down_migration_authorization_setting: app.allow_local_empty_down_migration
  destructive_down_migrations_require_empty_tables: true
  destructive_down_migrations_require_exclusive_locks: true
  down_migration_authorization_is_transaction_local: true
