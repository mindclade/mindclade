syntax = "proto3";

package mindclade.events.evaluation.v1;

import "google/protobuf/timestamp.proto";
import "proto/mindclade/artifact/v1/artifact_reference.proto";
import "proto/mindclade/common/v1/resource_reference.proto";
import "proto/mindclade/evaluation/v1/evaluation_result.proto";

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/evaluation/v1;evaluationv1";

// EvaluationResultCommitted records fenced publication of immutable evaluation truth.
message EvaluationResultCommitted {
  string evaluation_result_name = 1;
  string evaluation_run_name = 2;
  int64 evaluation_run_revision = 3;
  mindclade.evaluation.v1.EvaluationResultOutcome outcome = 4;
  mindclade.artifact.v1.ArtifactRef report = 5;
  string result_digest = 6;
  mindclade.common.v1.ResourceRef operation = 7;
  google.protobuf.Timestamp committed_at = 8;
}
