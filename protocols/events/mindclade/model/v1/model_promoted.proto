syntax = "proto3";

package mindclade.events.model.v1;

import "google/protobuf/timestamp.proto";
import "proto/mindclade/artifact/v1/evidence_reference.proto";
import "proto/mindclade/model/v1/model_release.proto";

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/model/v1;modelv1";

// ModelPromoted is an immutable evidence-backed release-stage transition fact.
message ModelPromoted {
  string model_release_name = 1;
  int64 model_release_revision = 2;
  mindclade.model.v1.ModelReleaseStage prior_stage = 3;
  mindclade.model.v1.ModelReleaseStage promoted_stage = 4;
  repeated mindclade.artifact.v1.EvidenceRef evidence = 5;
  mindclade.artifact.v1.EvidenceRef promotion_decision = 6;
  google.protobuf.Timestamp promoted_at = 7;
}
