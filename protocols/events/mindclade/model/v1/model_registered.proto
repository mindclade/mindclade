syntax = "proto3";

package mindclade.events.model.v1;

import "google/protobuf/timestamp.proto";
import "proto/mindclade/artifact/v1/artifact_reference.proto";
import "proto/mindclade/common/v1/event_envelope.proto";

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/model/v1;modelv1";

// ModelRegistered is the immutable fact that a logical model definition was admitted.
message ModelRegistered {
  mindclade.common.v1.EventEnvelope envelope = 1;
  string model_name = 2;
  string model_uid = 3;
  int64 model_revision = 4;
  string family = 5;
  mindclade.artifact.v1.ArtifactRef definition_manifest = 6;
  mindclade.artifact.v1.ArtifactRef feature_requirement_set = 7;
  mindclade.artifact.v1.ArtifactRef model_feature_view = 8;
  google.protobuf.Timestamp registered_at = 9;
}
