syntax = "proto3";

package mindclade.events.model.v1;

import "google/protobuf/timestamp.proto";
import "proto/mindclade/artifact/v1/artifact_reference.proto";

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/model/v1;modelv1";

// ModelRegistered is the immutable fact that a logical model definition was admitted.
message ModelRegistered {
  string model_name = 1;
  string model_uid = 2;
  int64 model_revision = 3;
  string family = 4;
  mindclade.artifact.v1.ArtifactRef definition_manifest = 5;
  mindclade.artifact.v1.ArtifactRef feature_requirement_set = 6;
  mindclade.artifact.v1.ArtifactRef model_feature_view = 7;
  google.protobuf.Timestamp registered_at = 8;
}
