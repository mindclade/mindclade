syntax = "proto3";

package mindclade.events.experiment.v1;

import "google/protobuf/timestamp.proto";
import "proto/mindclade/experiment/v1/experiment.proto";

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/experiment/v1;experimentv1";

// ExperimentStateChanged records one validated experiment lifecycle transition.
message ExperimentStateChanged {
  mindclade.experiment.v1.Experiment experiment = 1;
  mindclade.experiment.v1.ExperimentState prior_state = 2;
  string reason_code = 3;
  google.protobuf.Timestamp changed_at = 4;
}
