syntax = "proto3";

package mindclade.events.agent.v1;

import "google/protobuf/timestamp.proto";
import "proto/mindclade/common/v1/resource_reference.proto";

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/agent/v1;agentv1";

// AgentCancellationRequested records monotonic cancellation intent.
message AgentCancellationRequested {
  mindclade.common.v1.ResourceRef agent_run = 1;
  string reason = 2;
  mindclade.common.v1.ResourceRef operation = 3;
  google.protobuf.Timestamp requested_at = 4;
}
