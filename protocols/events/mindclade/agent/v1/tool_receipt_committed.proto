syntax = "proto3";

package mindclade.events.agent.v1;

import "google/protobuf/timestamp.proto";
import "proto/mindclade/agent/v1/tool_receipt.proto";

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/agent/v1;agentv1";

// ToolReceiptCommitted is proof that executor-observed tool evidence became durable.
message ToolReceiptCommitted {
  mindclade.agent.v1.ToolReceipt receipt = 1;
  uint64 run_receipt_sequence = 2;
  google.protobuf.Timestamp committed_at = 3;
}
