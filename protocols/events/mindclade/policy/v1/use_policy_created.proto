syntax = "proto3";

package mindclade.events.policy.v1;

import "google/protobuf/timestamp.proto";
import "proto/mindclade/common/v1/resource_reference.proto";
import "proto/mindclade/policy/v1/use_policy.proto";

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/policy/v1;policyv1";

// UsePolicyCreated records admission of a policy backed by an immutable document.
message UsePolicyCreated {
  mindclade.policy.v1.UsePolicy use_policy = 1;
  mindclade.common.v1.ResourceRef operation = 2;
  google.protobuf.Timestamp created_at = 3;
}
