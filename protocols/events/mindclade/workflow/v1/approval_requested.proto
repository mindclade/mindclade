syntax = "proto3";

package mindclade.events.workflow.v1;

import "google/protobuf/timestamp.proto";
import "proto/mindclade/workflow/v1/approval.proto";

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/workflow/v1;workflowv1";

// ApprovalRequested records the exact consequential intent shown to reviewers.
message ApprovalRequested {
  mindclade.workflow.v1.ApprovalRequest approval_request = 1;
  google.protobuf.Timestamp recorded_at = 2;
}
