syntax = "proto3";

package mindclade.events.workflow.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "proto/mindclade/common/v1/resource_reference.proto";
import "proto/mindclade/workflow/v1/workflow_definition.proto";

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/workflow/v1;workflowv1";

// WorkflowDefinitionUpdated records one optimistic, field-masked revision.
message WorkflowDefinitionUpdated {
  mindclade.workflow.v1.WorkflowDefinition workflow_definition = 1;
  int64 previous_revision = 2;
  google.protobuf.FieldMask update_mask = 3;
  mindclade.common.v1.ResourceRef operation = 4;
  google.protobuf.Timestamp updated_at = 5;
}
