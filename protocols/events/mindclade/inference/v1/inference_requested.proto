syntax = "proto3";

package mindclade.events.inference.v1;

import "google/protobuf/timestamp.proto";
import "proto/mindclade/artifact/v1/artifact_reference.proto";
import "proto/mindclade/common/v1/resource_reference.proto";
import "proto/mindclade/inference/v1/inference_request.proto";

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/inference/v1;inferencev1";

// InferenceRequested records accepted bounded inference intent. Workers fetch the
// complete authoritative request by name instead of relying on an event copy.
message InferenceRequested {
  string inference_request_name = 1;
  string request_digest = 2;
  mindclade.inference.v1.InferenceMode mode = 3;
  mindclade.common.v1.ResourceRef model = 4;
  mindclade.artifact.v1.ArtifactRef input_artifact = 5;
  string inline_input_digest = 6;
  mindclade.common.v1.ResourceRef operation = 7;
  google.protobuf.Timestamp requested_at = 8;
}
