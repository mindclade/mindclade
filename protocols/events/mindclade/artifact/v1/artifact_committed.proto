syntax = "proto3";

package mindclade.events.artifact.v1;

import "proto/mindclade/artifact/v1/artifact_reference.proto";
import "proto/mindclade/common/v1/event_envelope.proto";

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/artifact/v1;artifactv1";

message ArtifactCommitted {
  mindclade.common.v1.EventEnvelope envelope = 1;
  mindclade.artifact.v1.ArtifactRef artifact = 2;
  string producer_attempt_id = 3;
}
