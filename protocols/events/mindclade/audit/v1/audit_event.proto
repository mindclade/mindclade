syntax = "proto3";

package mindclade.events.audit.v1;

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/audit/v1;auditv1";

// Immutable audit record for accepted or rejected durable intent.
message AuditEvent {
  string actor_principal_id = 1;
  string action = 2;
  string decision = 3;
  string policy_digest = 4;
}
