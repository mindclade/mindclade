# Curated source for generated candidate stages; semantic edits require matching public descriptors.
openapi: 3.1.0
info:
  title: Mindclade Public API
  version: 1.0.0
  summary: Durable, resource-oriented access to Mindclade capabilities.
  description: |
    This is the curated HTTP/JSON projection of the `mindclade.api.v1` facade.
    Internal RPC packages, persistence rows, queue envelopes, provider sessions,
    and storage locations are deliberately not part of this contract.

    Work that can outlive a request returns a durable Operation. Mutations are
    idempotent, reads and updates are revision-aware, pagination tokens are
    opaque, and large or sensitive values cross the API only as ArtifactRef.
  license:
    name: Proprietary
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
    description: Endpoint selected explicitly by the SDK/application profile.
security:
  - bearerAuth: []
x-mindclade-api-profile: v1
x-mindclade-authority:
  facade: mindclade.api.v1
  projection: curated-http-json
  compatibility: additive-after-clean-v1-baseline
  forbidden-public-authorities:
    - mindclade.internal
    - database-row
    - queue-envelope
    - provider-session
tags:
  - name: Operations
    description: Durable status, polling, and cancellation.
  - name: Training
    description: Durable training runs and checkpoints.

paths:
  /v1/tenants/{tenant}/projects/{project}/operations/{operation}:
    get:
      tags: [Operations]
      operationId: getOperation
      summary: Get durable operation state
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Current operation state.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/tenants/{tenant}/projects/{project}/operations/{operation}:cancel:
    post:
      tags: [Operations]
      operationId: cancelOperation
      summary: Request durable cancellation
      description: Cancellation is idempotent and does not claim immediate worker termination.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AbsoluteDeadline'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancellationRequest'
      responses:
        '200':
          description: Current operation after recording the cancellation request.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/tenants/{tenant}/projects/{project}/operations/{operation}:watch:
    get:
      tags: [Operations]
      operationId: watchOperation
      summary: Watch durable operation revisions
      description: Resumable server-sent events; each data field is one OperationEvent encoded with ProtoJSON. Validation failures before the first durable event use an HTTP problem response. Failures after HTTP 200 use an OperationEvent with eventType error and the last durable cursor.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/OperationId'
        - name: Last-Event-ID
          in: header
          required: false
          description: Last fully processed opaque event identifier.
          schema:
            type: string
            minLength: 1
            maxLength: 4096
      responses:
        '200':
          description: Ordered operation revisions until the operation is terminal or the client disconnects.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Accel-Buffering:
              schema:
                type: string
                const: 'no'
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/OperationEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: The authenticated resume cursor is outside the retained operation history.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PublicError'
        '412':
          description: The authenticated resume cursor is ahead of durable operation state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PublicError'
        '500':
          description: Durable operation history or the required streaming response capabilities could not be served safely.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PublicError'

  /v1/tenants/{tenant}/projects/{project}/trainingRuns:
    get:
      tags: [Training]
      operationId: listTrainingRuns
      summary: List training runs
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/OrderBy'
      responses:
        '200':
          description: Stable page of training runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingRunList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Training]
      operationId: createTrainingRun
      summary: Create durable training work
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AbsoluteDeadline'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingRunCreate'
      responses:
        '202':
          $ref: '#/components/responses/AcceptedOperation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/tenants/{tenant}/projects/{project}/trainingRuns/{trainingRun}:
    get:
      tags: [Training]
      operationId: getTrainingRun
      summary: Get a training run
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/TrainingRunId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Durable training run state.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingRun'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth2 access token or policy-approved workload credential

  parameters:
    TenantId:
      name: tenant
      in: path
      required: true
      description: Opaque tenant identifier; clients must not parse it.
      schema:
        $ref: '#/components/schemas/ResourceId'
    ProjectId:
      name: project
      in: path
      required: true
      description: Opaque project identifier verified against authenticated tenancy.
      schema:
        $ref: '#/components/schemas/ResourceId'
    OperationId:
      name: operation
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
    ArtifactId:
      name: artifact
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
    DatasetId:
      name: dataset
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
    ModelId:
      name: model
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
    TrainingRunId:
      name: trainingRun
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
    EvaluationRunId:
      name: evaluationRun
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
    EvaluationResultId:
      name: evaluationResult
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
    AgentRunId:
      name: agentRun
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
    WorkflowRunId:
      name: workflowRun
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
    ApprovalId:
      name: approval
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Scoped retry key. Reuse with different canonical request content is a conflict.
      schema:
        type: string
        minLength: 16
        maxLength: 256
    AbsoluteDeadline:
      name: X-Mindclade-Deadline
      in: header
      required: true
      description: Absolute, future RFC 3339 UTC deadline for work admission.
      schema:
        type: string
        format: date-time
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Last observed strong ETag; stale revisions fail with conflict.
      schema:
        type: string
        minLength: 3
        maxLength: 160
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Last observed ETag for revision-aware reads and polling.
      schema:
        type: string
        minLength: 1
        maxLength: 160
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Bounded page size; defaults to 50 and never exceeds 200.
      schema:
        type: integer
        format: uint32
        minimum: 1
        maximum: 200
        default: 50
    PageToken:
      name: pageToken
      in: query
      required: false
      description: Opaque continuation token; clients must not inspect or persist it indefinitely.
      schema:
        type: string
        maxLength: 4096
    Filter:
      name: filter
      in: query
      required: false
      description: Bounded server-declared filter expression.
      schema:
        type: string
        maxLength: 2048
    OrderBy:
      name: orderBy
      in: query
      required: false
      description: Comma-separated supported fields with optional asc or desc direction.
      schema:
        type: string
        maxLength: 512

  headers:
    ETag:
      description: Strong revision token for this representation.
      schema:
        type: string
    Location:
      description: Canonical URI of the created resource.
      schema:
        type: string
        format: uri-reference
    ContentDigest:
      description: RFC 9530 content digest matching the immutable ArtifactRef.
      schema:
        type: string
        pattern: '^sha-256=:[A-Za-z0-9+/]{43}=:$'

  responses:
    AcceptedOperation:
      description: Durable work admitted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Operation'
    BadRequest:
      description: Request validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PublicError'
    Unauthenticated:
      description: A valid authentication credential is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PublicError'
    Forbidden:
      description: The principal is not authorized for this resource and action.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PublicError'
    NotFound:
      description: Resource not found or intentionally concealed by authorization policy.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PublicError'
    Conflict:
      description: Idempotency content, revision, state, or precondition conflict.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PublicError'
    RateLimited:
      description: Bounded quota or rate limit reached.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PublicError'
    NotModified:
      description: The representation matches If-None-Match; the response has no body.

  schemas:
    ResourceId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]*$'
    ResourceName:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: '^[A-Za-z][A-Za-z0-9]*/[^/]+(?:/[A-Za-z][A-Za-z0-9]*/[^/]+)*$'
      description: Opaque canonical resource name; clients must not derive database or storage keys.
    Digest:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp normalized to UTC by the service.
    StringMap:
      type: object
      maxProperties: 64
      additionalProperties:
        type: string
        maxLength: 512

    ArtifactRef:
      type: object
      additionalProperties: false
      x-mindclade-authoritative-message: mindclade.api.v1.ArtifactRef
      required: [digest, mediaType, sizeBytes, artifactKind]
      properties:
        digest:
          $ref: '#/components/schemas/Digest'
        mediaType:
          type: string
          minLength: 1
          maxLength: 255
        sizeBytes:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
        artifactKind:
          type: string
          minLength: 1
          maxLength: 128
        schemaId:
          type: string
          maxLength: 512
        integrityDigest:
          $ref: '#/components/schemas/Digest'

    EvidenceRef:
      type: object
      additionalProperties: false
      x-mindclade-authoritative-message: mindclade.api.v1.EvidenceRef
      required: [digest, subjectDigest, evidenceKind, policyDigest]
      properties:
        digest:
          $ref: '#/components/schemas/Digest'
        subjectDigest:
          $ref: '#/components/schemas/Digest'
        evidenceKind:
          type: string
          maxLength: 128
        policyDigest:
          $ref: '#/components/schemas/Digest'

    ResourceRef:
      type: object
      additionalProperties: false
      required: [name, uid, revision]
      properties:
        name:
          $ref: '#/components/schemas/ResourceName'
        uid:
          type: string
          minLength: 1
          maxLength: 128
        revision:
          type: string
          pattern: '^[1-9][0-9]*$'

    ErrorDetail:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [fieldViolation, resource, precondition, policy, quota, conflict]
        field:
          type: string
          maxLength: 256
        reason:
          type: string
          maxLength: 128
        resource:
          $ref: '#/components/schemas/ResourceRef'
        currentRevision:
          type: string
          pattern: '^[1-9][0-9]*$'
        limitName:
          type: string
          maxLength: 128

    PublicError:
      type: object
      additionalProperties: false
      required: [code, message, requestId, retryable]
      properties:
        code:
          type: string
          enum:
            - AUTHENTICATION_REQUIRED
            - PERMISSION_DENIED
            - INVALID_ARGUMENT
            - FAILED_PRECONDITION
            - NOT_FOUND
            - CONFLICT
            - RATE_LIMITED
            - QUOTA_EXCEEDED
            - UNAVAILABLE
            - DEADLINE_EXCEEDED
            - CANCELLED
            - INTERNAL
        message:
          type: string
          minLength: 1
          maxLength: 1024
          description: Human-safe message without secrets, payloads, SQL, or stack traces.
        requestId:
          type: string
          minLength: 1
          maxLength: 128
        traceId:
          type: string
          maxLength: 128
        retryable:
          type: boolean
        retryAfter:
          type: string
          format: duration
        diagnosticRef:
          type: string
          maxLength: 256
        details:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/ErrorDetail'

    PageMetadata:
      type: object
      additionalProperties: false
      properties:
        nextPageToken:
          type: string
          maxLength: 4096
        snapshotToken:
          type: string
          maxLength: 4096

    Operation:
      type: object
      additionalProperties: false
      x-mindclade-authoritative-message: mindclade.api.v1.Operation
      required: [name, uid, revision, etag, state, done, createTime, updateTime]
      properties:
        name:
          $ref: '#/components/schemas/ResourceName'
        uid:
          type: string
          minLength: 1
          maxLength: 128
        revision:
          type: string
          pattern: '^[1-9][0-9]*$'
        etag:
          type: string
          minLength: 3
          maxLength: 160
        state:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELLING, CANCELLED]
        done:
          type: boolean
        createTime:
          $ref: '#/components/schemas/Timestamp'
        updateTime:
          $ref: '#/components/schemas/Timestamp'
        target:
          $ref: '#/components/schemas/ResourceRef'
        result:
          $ref: '#/components/schemas/OperationResult'
        error:
          $ref: '#/components/schemas/PublicError'
      description: At terminal state, exactly one of result or error is present.

    OperationResult:
      type: object
      additionalProperties: false
      properties:
        resource:
          $ref: '#/components/schemas/ResourceRef'
        inference:
          $ref: '#/components/schemas/InferenceResult'
        manifest:
          $ref: '#/components/schemas/ArtifactRef'
        artifacts:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/ArtifactRef'

    OperationEvent:
      type: object
      additionalProperties: false
      x-mindclade-authoritative-message: mindclade.api.v1.OperationEvent
      description: A durable operation update, terminal record, gateway heartbeat, or sanitized post-commit stream error. The four shapes are mutually exclusive.
      required: [eventId, eventType, schemaVersion, operationRevision, resumeCursor, heartbeat, emittedAt]
      discriminator:
        propertyName: eventType
        mapping:
          operation.updated: '#/components/schemas/OperationEvent/oneOf/0'
          operation.terminal: '#/components/schemas/OperationEvent/oneOf/1'
          heartbeat: '#/components/schemas/OperationEvent/oneOf/2'
          error: '#/components/schemas/OperationEvent/oneOf/3'
      oneOf:
        - title: Operation update
          properties:
            eventType:
              const: operation.updated
            heartbeat:
              const: false
          required: [operation]
          not:
            required: [error]
        - title: Terminal operation
          properties:
            eventType:
              const: operation.terminal
            heartbeat:
              const: false
          required: [operation]
          not:
            required: [error]
        - title: Heartbeat
          properties:
            eventType:
              const: heartbeat
            heartbeat:
              const: true
          not:
            anyOf:
              - required: [operation]
              - required: [error]
        - title: Sanitized stream error
          properties:
            eventType:
              const: error
            heartbeat:
              const: false
          required: [error]
          not:
            required: [operation]
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 4096
        operation:
          $ref: '#/components/schemas/Operation'
        eventType:
          type: string
          enum: [operation.updated, operation.terminal, heartbeat, error]
        schemaVersion:
          type: integer
          format: uint32
          enum: [1]
        operationRevision:
          type: string
          pattern: '^[0-9]+$'
        resumeCursor:
          type: string
          minLength: 1
          maxLength: 4096
        heartbeat:
          type: boolean
        emittedAt:
          $ref: '#/components/schemas/Timestamp'
        error:
          $ref: '#/components/schemas/PublicError'

    CancellationRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 512

    Artifact:
      type: object
      additionalProperties: false
      required: [name, uid, createTime, ref]
      properties:
        name:
          $ref: '#/components/schemas/ResourceName'
        uid:
          type: string
          minLength: 1
          maxLength: 128
        createTime:
          $ref: '#/components/schemas/Timestamp'
        policyClassification:
          type: string
          maxLength: 128
        ref:
          $ref: '#/components/schemas/ArtifactRef'

    MutableResourceMetadata:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 256
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'
        policyClassification:
          type: string
          maxLength: 128

    ResourceMetadata:
      type: object
      required: [name, uid, revision, etag, createTime, updateTime]
      properties:
        name:
          $ref: '#/components/schemas/ResourceName'
        uid:
          type: string
          minLength: 1
          maxLength: 128
        revision:
          type: string
          pattern: '^[1-9][0-9]*$'
        etag:
          type: string
          minLength: 3
          maxLength: 160
        createTime:
          $ref: '#/components/schemas/Timestamp'
        updateTime:
          $ref: '#/components/schemas/Timestamp'
        deleteTime:
          $ref: '#/components/schemas/Timestamp'

    DatasetCreate:
      allOf:
        - type: object
          required: [datasetId]
          properties:
            datasetId:
              $ref: '#/components/schemas/ResourceId'
        - $ref: '#/components/schemas/MutableResourceMetadata'
    DatasetUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 256
        labels:
          $ref: '#/components/schemas/StringMap'
        annotations:
          $ref: '#/components/schemas/StringMap'
    Dataset:
      allOf:
        - $ref: '#/components/schemas/ResourceMetadata'
        - $ref: '#/components/schemas/MutableResourceMetadata'
        - type: object
          x-mindclade-authoritative-message: mindclade.api.v1.DatasetView
          required: [state]
          properties:
            state:
              type: string
              enum: [DRAFT, ACTIVE, DEPRECATED, DELETED]
            currentRelease:
              $ref: '#/components/schemas/ResourceRef'
    DatasetList:
      type: object
      required: [datasets, page]
      properties:
        datasets:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Dataset'
        page:
          $ref: '#/components/schemas/PageMetadata'
    DatasetReleaseCreate:
      type: object
      additionalProperties: false
      required: [releaseId, manifest, policyClassification]
      properties:
        releaseId:
          $ref: '#/components/schemas/ResourceId'
        manifest:
          $ref: '#/components/schemas/ArtifactRef'
        qualificationEvidence:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/EvidenceRef'
        parentRelease:
          $ref: '#/components/schemas/ResourceRef'
        usePolicy:
          $ref: '#/components/schemas/ResourceRef'
        policyClassification:
          type: string
          maxLength: 128
    DatasetRelease:
      allOf:
        - $ref: '#/components/schemas/ResourceMetadata'
        - type: object
          x-mindclade-authoritative-message: mindclade.api.v1.DatasetReleaseView
          required: [dataset, releaseId, state, manifest, policyClassification]
          properties:
            dataset:
              $ref: '#/components/schemas/ResourceRef'
            releaseId:
              $ref: '#/components/schemas/ResourceId'
            state:
              type: string
              enum: [DRAFT, ACTIVE, DEPRECATED, REVOKED]
            manifest:
              $ref: '#/components/schemas/ArtifactRef'
            qualificationEvidence:
              type: array
              maxItems: 64
              items:
                $ref: '#/components/schemas/EvidenceRef'
            policyClassification:
              type: string
              maxLength: 128
    DatasetReleaseList:
      type: object
      required: [releases, page]
      properties:
        releases:
          type: array
