apiVersion: mindclade.dev/v1
kind: InternalSdkGeneration
metadata:
  name: internal-sdk-v1
  owner: developer-experience
  contractOwner: contract-governance
  status: candidate-unratified
  productionAuthority: false
spec:
  authority:
    contracts:
      - protocols/proto
      - protocols/events
    generatedRoot: protocols/generated
    generator: buf.gen.yaml
    toolchainLock: tools/codegen/toolchain.lock.json
    facadeRoot: internal/sdk
    openapiProjection: protocols/openapi/published/mindclade.openapi.yaml
    rule: Protobuf owns internal resource, RPC, and event meaning; generated native bindings own transport mechanics; Mindclade-owned internal facades own client ergonomics.
    dependencyDirection:
      - protocols/proto-and-events
      - protocols/generated
      - internal/sdk
      - services-workers-training-tools-and-internal-apps
    forbiddenAuthorities:
      - openapi-for-native-internal-rpcs
      - hosted-sdk-provider-state
      - provider-native-configuration
      - handwritten-wire-models
      - database-schema

  nativeGeneration:
    owner: mindclade
    implementation: buf-and-pinned-native-generators
    deterministic: true
    committedOutputs: true
    languages:
      go:
        messages: protoc-gen-go
        grpc: protoc-gen-go-grpc
        output: protocols/generated/go
        facade: internal/sdk/go
      python:
        messages: protoc-python-and-pyi
        grpc: grpcio-tools
        output: protocols/generated/python
        facade: internal/sdk/python
      rust:
        messages: prost
        grpc: tonic
        output: protocols/generated/rust
        facade: internal/sdk/rust
      typescript:
        messages: protobuf-es
        grpc: connect-es
        output: protocols/generated/typescript
        facade: internal/sdk/typescript
    guarantees:
      - generated-code-is-never-hand-edited
      - generated-wire-types-are-reused-not-redeclared
      - every-generated-package-has-an-executable-consumer-profile
      - clean-generation-is-byte-for-byte-reproducible

  internalSdkPolicy:
    owner: mindclade
    version: v1-candidate
    source: protocols/openapi/generation.yaml#spec.internalSdkPolicy
    canonicalization: canonical-json-sorted-keys
    visibility: repository-internal
    roots:
      go: internal/sdk/go
      python: internal/sdk/python
      rust: internal/sdk/rust
      typescript: internal/sdk/typescript
    models: intentionally-exported-generated-protobuf-types
    handwrittenWireModels: forbidden
    facadeResponsibilities:
      - authentication-metadata
      - finite-deadlines
      - safe-idempotent-retries
      - pagination
      - operation-polling-watching-and-cancellation
      - artifact-transfer-and-digest-verification
      - stable-error-mapping
      - tracing-and-request-correlation
    directGeneratedImportPolicy:
      default: forbidden-outside-allowlist
      allowedRoles:
        - internal-sdk-implementation
        - generated-server-transport-adapter-or-registration
        - persistence-protobuf-mapper
        - contract-or-conformance-test
      clientConsumerRule: Services, workers, training code, tools, and internal applications acting as clients import internal/sdk rather than protocols/generated.

  pipeline:
    version: v2-candidate
    interfaces:
      - ProtoContractValidator
      - BufNativeGenerator
      - GeneratedBindingCompiler
      - InternalFacadeBuilder
      - InternalSdkConformanceVerifier
      - LayeringPolicyVerifier
    sourceChecks:
      - buf-lint-and-build
      - candidate-breaking-comparison
      - generated-drift
      - cross-language-wire-and-protojson-roundtrip
      - grpc-loopback-and-network-conformance
      - facade-behavior-conformance
      - forbidden-direct-generated-imports
    publication: none-internal-only

  publicHttpCandidate:
    status: candidate-unratified
    authority: public-protobuf-descriptor
    descriptorService: mindclade.api.v1.MindcladeService
    activeOperationIds:
      - getOperation
      - cancelOperation
      - watchOperation
      - listTrainingRuns
      - createTrainingRun
      - getTrainingRun
    stages:
      raw:
        output: protocols/openapi/raw/mindclade.openapi.yaml
        buildMirror: build/openapi/raw/descriptor-projection.yaml
        generatedFrom:
          - google.api.http
          - mindclade.api.v1.public_http
          - mindclade.api.v1.public_message
        contains:
          - http-method-path-body-and-query-bindings
          - authentication-status-and-header-bindings
          - stream-projection
          - complete-protojson-component-shapes
      curated:
        source: protocols/openapi/external-api.yaml
        output: protocols/openapi/curated/mindclade.openapi.yaml
        buildMirror: build/openapi/curated/external-api.yaml
        allowedTransforms:
          - trim-unreachable-components
          - descriptions-and-examples
          - tags-and-documentation-links
          - stable-operation-display-metadata
          - sdk-specific-x-mindclade-metadata
        forbiddenTransforms:
          - http-method-path-body-or-query-binding
          - authentication-or-success-status
          - requiredness-or-protojson-representation
          - response-header-or-stream-framing
      published:
        output: protocols/openapi/published/mindclade.openapi.yaml
        buildMirror: build/openapi/published/external-api.yaml
        rule: byte-identical-to-validated-curated-candidate
    requiredChecks:
      - exact-descriptor-gateway-binding-parity
      - exact-descriptor-protojson-component-parity
      - curated-published-byte-identity
      - no-inactive-rpc-advertisement
    genericGrpcGatewayStreaming: forbidden
    sseAdapter: explicit-http-transport-over-watch-operation
    publishAuthorized: false

  optionalRestGeneration:
    enabledByDefault: false
    authority: false
    source: protocols/openapi/published/mindclade.openapi.yaml
    policyOwner: mindclade
    policySource: protocols/openapi/generation.yaml#spec.optionalRestGeneration
    purpose: Optional internal HTTP/JSON clients for consumers that cannot use native gRPC or Connect.
    providerConfigurationRule: derived-only
    interfaces:
      - OpenApiValidator
      - ProviderPolicyCompiler
      - SdkEmitter
      - SdkBehaviorVerifier
    providers:
      - id: fern
        displayName: Fern
        role: optional-internal-rest-generator
        foundational: false
        releasePrimaryEligible: false
        connection: hosted-or-enterprise-self-hosted
        readiness: configuration-only
        languages: [go, python, rust, typescript]
        source: protocols/openapi/published/mindclade.openapi.yaml
        adapter:
          contractVersion: v1
          providerVersion: unpinned
          executable: null
          executableSha256: null
        qualificationNotes:
          repository: https://github.com/fern-api/fern
          publicRepositoryLicense: Apache-2.0
          selfHostedWorkflow: enterprise-docker-token-and-outbound-verification-required
          providerStateIsAuthority: false
        configuration:
          policySource: protocols/openapi/generation.yaml#spec.optionalRestGeneration
          mappingStatus: not-yet-implemented
        release:
          publish: false
          connectedQualificationRequired: true

      - id: speakeasy
        displayName: Speakeasy
        role: optional-specialized-rest-benchmark
        foundational: false
        releasePrimaryEligible: false
        connection: hosted-or-cli-adapter
        readiness: configuration-only
        languages: [go, python, typescript]
        source: protocols/openapi/published/mindclade.openapi.yaml
        adapter:
          contractVersion: v1
          providerVersion: unpinned
          executable: null
          executableSha256: null
        qualificationNotes:
          documentation: https://www.speakeasy.com/docs/sdks/create-client-sdks
          cliRepository: https://github.com/speakeasy-api/speakeasy
          cliLicense: Elastic-2.0
          providerStateIsAuthority: false
          licenseAndTermsReviewRequired: true
        configuration:
          policySource: protocols/openapi/generation.yaml#spec.optionalRestGeneration
          mappingStatus: not-yet-implemented
        release:
          publish: false
          connectedQualificationRequired: true
    parity:
      reference: native-internal-sdk-behavior
      compare:
        - operation-ids
        - request-and-response-protojson
        - authentication-metadata
        - idempotency
        - pagination
        - operation-wait-watch-and-cancel
        - stable-error-mapping
      failurePolicy: Optional provider output is rejected on any semantic difference and cannot block native SDK delivery when unused.

  localOptionalRestAdapter:
    mode: offline-plan-and-verify
    implementation: tools/codegen/sdk_generator.py
    readiness: implemented
    network: forbidden
    emitsSdkSource: false
    purpose: Validate and plan non-authoritative Fern or Speakeasy comparisons without invoking hosted services during source checks.

  qualification:
    candidateStatus: unratified
    nativeInternalSdkRequired: true
    optionalRestProviderRequired: false
    connectedProviderStatus: not-run
    publishAuthorized: false
