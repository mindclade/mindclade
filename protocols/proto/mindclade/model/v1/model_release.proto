syntax = "proto3";

package mindclade.model.v1;

import "google/protobuf/timestamp.proto";
import "proto/mindclade/artifact/v1/artifact_reference.proto";
import "proto/mindclade/artifact/v1/evidence_reference.proto";
import "proto/mindclade/common/v1/resource_reference.proto";

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/model/v1;modelv1";

// ModelReleaseStage is the governed qualification and publication lifecycle.
enum ModelReleaseStage {
  MODEL_RELEASE_STAGE_UNSPECIFIED = 0;
  MODEL_RELEASE_STAGE_EXPERIMENTAL = 1;
  MODEL_RELEASE_STAGE_QUALIFIED = 2;
  MODEL_RELEASE_STAGE_RELEASE_CANDIDATE = 3;
  MODEL_RELEASE_STAGE_RELEASED = 4;
  MODEL_RELEASE_STAGE_DEPRECATED = 5;
  MODEL_RELEASE_STAGE_REVOKED = 6;
}

// ModelRelease binds one model version to an immutable bundle and verified checkpoint.
message ModelRelease {
  string name = 1;
  string uid = 2;
  int64 revision = 3;
  string etag = 4;
  string tenant_name = 5;
  string project_name = 6;
  string model_name = 7;
  string release_id = 8;
  ModelReleaseStage stage = 9;
  mindclade.artifact.v1.ArtifactRef bundle_manifest = 10;
  mindclade.artifact.v1.ArtifactRef model_manifest = 11;
  mindclade.common.v1.ResourceRef checkpoint = 12;
  repeated mindclade.artifact.v1.EvidenceRef evaluation_evidence = 13;
  mindclade.artifact.v1.ArtifactRef feature_requirement_set = 14;
  mindclade.artifact.v1.ArtifactRef model_feature_view = 15;
  mindclade.common.v1.ResourceRef release_policy = 16;
  string policy_classification = 17;
  google.protobuf.Timestamp create_time = 18;
  google.protobuf.Timestamp qualify_time = 19;
  google.protobuf.Timestamp release_time = 20;
  google.protobuf.Timestamp revoke_time = 21;
  string revocation_reason = 22;
}
