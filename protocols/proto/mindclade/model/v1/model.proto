syntax = "proto3";

package mindclade.model.v1;

import "google/protobuf/timestamp.proto";
import "proto/mindclade/artifact/v1/artifact_reference.proto";

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/model/v1;modelv1";

// ModelState is the lifecycle of a logical model family entry.
enum ModelState {
  MODEL_STATE_UNSPECIFIED = 0;
  MODEL_STATE_ACTIVE = 1;
  MODEL_STATE_DEPRECATED = 2;
  MODEL_STATE_REVOKED = 3;
}

// Model is a logical family definition; executable weights belong to immutable releases.
message Model {
  string name = 1;
  string uid = 2;
  int64 revision = 3;
  string etag = 4;
  string tenant_name = 5;
  string project_name = 6;
  string display_name = 7;
  string family = 8;
  ModelState state = 9;
  mindclade.artifact.v1.ArtifactRef definition_manifest = 10;
  mindclade.artifact.v1.ArtifactRef feature_requirement_set = 11;
  mindclade.artifact.v1.ArtifactRef model_feature_view = 12;
  mindclade.artifact.v1.ArtifactRef input_contract = 13;
  mindclade.artifact.v1.ArtifactRef output_contract = 14;
  map<string, string> labels = 15;
  map<string, string> annotations = 16;
  string policy_classification = 17;
  google.protobuf.Timestamp create_time = 18;
  google.protobuf.Timestamp update_time = 19;
  google.protobuf.Timestamp delete_time = 20;
  string current_release_name = 21;
}
