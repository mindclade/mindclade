syntax = "proto3";

package mindclade.agent.v1;

import "google/protobuf/timestamp.proto";
import "proto/mindclade/artifact/v1/artifact_reference.proto";
import "proto/mindclade/common/v1/error_detail.proto";
import "proto/mindclade/common/v1/resource_reference.proto";
import "proto/mindclade/policy/v1/policy_reference.proto";

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/agent/v1;agentv1";

// AgentRunState is the bounded, durable agent lifecycle.
enum AgentRunState {
  AGENT_RUN_STATE_UNSPECIFIED = 0;
  AGENT_RUN_STATE_CREATED = 1;
  AGENT_RUN_STATE_VALIDATING = 2;
  AGENT_RUN_STATE_ADMITTED = 3;
  AGENT_RUN_STATE_READY = 4;
  AGENT_RUN_STATE_RUNNING = 5;
  AGENT_RUN_STATE_WAITING_FOR_TOOL = 6;
  AGENT_RUN_STATE_WAITING_FOR_JOB = 7;
  AGENT_RUN_STATE_WAITING_FOR_APPROVAL = 8;
  AGENT_RUN_STATE_PAUSED = 9;
  AGENT_RUN_STATE_SUCCEEDED = 10;
  AGENT_RUN_STATE_FAILED = 11;
  AGENT_RUN_STATE_CANCELLING = 12;
  AGENT_RUN_STATE_CANCELLED = 13;
  AGENT_RUN_STATE_EXPIRED = 14;
}

// AgentBudgetUsage is a bounded accounting projection reconciled by receipts.
message AgentBudgetUsage {
  uint64 model_tokens = 1;
  uint32 iterations = 2;
  uint32 tool_calls = 3;
  uint64 storage_bytes = 4;
  uint64 external_spend_micros = 5;
  uint64 accelerator_milliseconds = 6;
  uint64 cpu_milliseconds = 7;
}

// AgentRun is durable state; provider sessions and chat transcripts are not authority.
message AgentRun {
  string name = 1;
  string uid = 2;
  int64 revision = 3;
  string etag = 4;
  string tenant_id = 5;
  string project_id = 6;
  mindclade.common.v1.ResourceRef definition = 7;
  string definition_digest = 8;
  mindclade.common.v1.ResourceRef workflow_run = 9;
  repeated mindclade.policy.v1.PolicyReference policy_snapshots = 10;
  mindclade.artifact.v1.ArtifactRef input = 11;
  mindclade.artifact.v1.ArtifactRef model_provider_manifest = 12;
  mindclade.common.v1.ResourceRef budget_reservation = 13;
  AgentBudgetUsage budget_usage = 14;
  AgentRunState state = 15;
  string active_step_name = 16;
  uint64 next_step_sequence = 17;
  string attempt_id = 18;
  uint64 lease_epoch = 19;
  bool cancellation_requested = 20;
  // Terminal success requires a verified AgentRunManifest.
  mindclade.artifact.v1.ArtifactRef run_manifest = 21;
  mindclade.artifact.v1.ArtifactRef output = 22;
  mindclade.common.v1.ErrorDetail failure = 23;
  google.protobuf.Timestamp create_time = 24;
  google.protobuf.Timestamp update_time = 25;
  optional google.protobuf.Timestamp end_time = 26;
}
