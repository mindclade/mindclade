syntax = "proto3";

package mindclade.training.v1;

import "google/protobuf/timestamp.proto";
import "proto/mindclade/artifact/v1/artifact_reference.proto";
import "proto/mindclade/common/v1/error_detail.proto";
import "proto/mindclade/common/v1/resource_reference.proto";
import "proto/mindclade/job/v1/lease_fencing.proto";
import "proto/mindclade/training/v1/training_progress.proto";

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/training/v1;trainingv1";

// TrainingRunState is the durable lifecycle of one frozen training intent.
enum TrainingRunState {
  TRAINING_RUN_STATE_UNSPECIFIED = 0;
  TRAINING_RUN_STATE_CREATED = 1;
  TRAINING_RUN_STATE_VALIDATING = 2;
  TRAINING_RUN_STATE_ADMITTED = 3;
  TRAINING_RUN_STATE_RUNNING = 4;
  TRAINING_RUN_STATE_CHECKPOINTING = 5;
  TRAINING_RUN_STATE_RECOVERING = 6;
  TRAINING_RUN_STATE_DRAINING = 7;
  TRAINING_RUN_STATE_COMPLETED = 8;
  TRAINING_RUN_STATE_FAILED = 9;
  TRAINING_RUN_STATE_CANCELLED = 10;
}

// TrainingTerminalClassification is the stable terminal result of a fenced run.
enum TrainingTerminalClassification {
  TRAINING_TERMINAL_CLASSIFICATION_UNSPECIFIED = 0;
  TRAINING_TERMINAL_CLASSIFICATION_SUCCEEDED = 1;
  TRAINING_TERMINAL_CLASSIFICATION_CANCELLED = 2;
  TRAINING_TERMINAL_CLASSIFICATION_POLICY_DENIED = 3;
  TRAINING_TERMINAL_CLASSIFICATION_INVALID_INPUT = 4;
  TRAINING_TERMINAL_CLASSIFICATION_RESOURCE_EXHAUSTED = 5;
  TRAINING_TERMINAL_CLASSIFICATION_TRANSIENT_FAILURE = 6;
  TRAINING_TERMINAL_CLASSIFICATION_EXECUTION_FAILURE = 7;
  TRAINING_TERMINAL_CLASSIFICATION_NUMERICAL_FAILURE = 8;
  TRAINING_TERMINAL_CLASSIFICATION_STALE_FENCE = 9;
}

// TrainingRun binds frozen scientific intent to one durable execution lifecycle.
message TrainingRun {
  string name = 1;
  string uid = 2;
  int64 revision = 3;
  string etag = 4;
  string tenant_name = 5;
  string project_name = 6;
  TrainingRunState state = 7;
  mindclade.artifact.v1.ArtifactRef training_recipe = 8;
  mindclade.common.v1.ResourceRef dataset_release = 9;
  mindclade.common.v1.ResourceRef model_release = 10;
  mindclade.artifact.v1.ArtifactRef executable_plan = 11;
  mindclade.artifact.v1.ArtifactRef hardware_topology = 12;
  mindclade.common.v1.ResourceRef use_policy = 13;
  mindclade.job.v1.LeaseFence active_fence = 14;
  TrainingProgress committed_progress = 15;
  mindclade.common.v1.ResourceRef latest_checkpoint = 16;
  mindclade.artifact.v1.ArtifactRef result_manifest = 17;
  TrainingTerminalClassification terminal_classification = 18;
  mindclade.common.v1.ErrorDetail error = 19;
  map<string, string> labels = 20;
  string policy_classification = 21;
  google.protobuf.Timestamp create_time = 22;
  google.protobuf.Timestamp start_time = 23;
  google.protobuf.Timestamp complete_time = 24;
}
