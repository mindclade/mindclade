syntax = "proto3";

package mindclade.dataset.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/dataset/v1;datasetv1";

// DatasetState is the durable lifecycle of a logical dataset.
enum DatasetState {
  DATASET_STATE_UNSPECIFIED = 0;
  DATASET_STATE_DRAFT = 1;
  DATASET_STATE_ACTIVE = 2;
  DATASET_STATE_DEPRECATED = 3;
  DATASET_STATE_REVOKED = 4;
}

// Dataset is the tenant-scoped logical identity for immutable dataset releases.
message Dataset {
  string name = 1;
  string uid = 2;
  int64 revision = 3;
  string etag = 4;
  string tenant_name = 5;
  string project_name = 6;
  string display_name = 7;
  map<string, string> labels = 8;
  map<string, string> annotations = 9;
  DatasetState state = 10;
  string policy_classification = 11;
  google.protobuf.Timestamp create_time = 12;
  google.protobuf.Timestamp update_time = 13;
  google.protobuf.Timestamp delete_time = 14;
  string current_release_name = 15;
}
