syntax = "proto3";

package mindclade.evaluation.v1;

import "google/protobuf/timestamp.proto";
import "proto/mindclade/artifact/v1/artifact_reference.proto";
import "proto/mindclade/common/v1/error_detail.proto";
import "proto/mindclade/common/v1/resource_reference.proto";
import "proto/mindclade/policy/v1/policy_reference.proto";

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/evaluation/v1;evaluationv1";

// EvaluationRunState is the durable, fenced evaluation lifecycle.
enum EvaluationRunState {
  EVALUATION_RUN_STATE_UNSPECIFIED = 0;
  EVALUATION_RUN_STATE_CREATED = 1;
  EVALUATION_RUN_STATE_VALIDATING = 2;
  EVALUATION_RUN_STATE_QUEUED = 3;
  EVALUATION_RUN_STATE_RUNNING = 4;
  EVALUATION_RUN_STATE_AGGREGATING = 5;
  EVALUATION_RUN_STATE_PUBLISHING = 6;
  EVALUATION_RUN_STATE_SUCCEEDED = 7;
  EVALUATION_RUN_STATE_FAILED = 8;
  EVALUATION_RUN_STATE_CANCELLING = 9;
  EVALUATION_RUN_STATE_CANCELLED = 10;
  EVALUATION_RUN_STATE_EXPIRED = 11;
}

// EvaluationRun tracks one immutable suite/snapshot execution without redefining metric meaning.
message EvaluationRun {
  string name = 1;
  string uid = 2;
  int64 revision = 3;
  string etag = 4;
  string tenant_id = 5;
  string project_id = 6;
  // Immutable suite defining tasks, metrics, statistics, thresholds, and safety policy.
  mindclade.artifact.v1.ArtifactRef suite = 7;
  // Ordered immutable datasets/cohorts resolved by the suite.
  repeated mindclade.artifact.v1.ArtifactRef datasets = 8;
  // Immutable EvaluationSnapshotManifest or released model bundle.
  mindclade.artifact.v1.ArtifactRef snapshot = 9;
  mindclade.common.v1.ResourceRef model_release = 10;
  mindclade.artifact.v1.ArtifactRef inference_protocol = 11;
  mindclade.artifact.v1.ArtifactRef executable_plan = 12;
  mindclade.artifact.v1.ArtifactRef provider_manifest = 13;
  mindclade.artifact.v1.ArtifactRef kernel_qualification = 14;
  repeated mindclade.policy.v1.PolicyReference policy_snapshots = 15;
  string request_digest = 16;
  string job_id = 17;
  string attempt_id = 18;
  uint64 lease_epoch = 19;
  EvaluationRunState state = 20;
  uint64 completed_samples = 21;
  optional uint64 total_samples = 22;
  mindclade.common.v1.ErrorDetail failure = 23;
  google.protobuf.Timestamp create_time = 24;
  google.protobuf.Timestamp update_time = 25;
  optional google.protobuf.Timestamp end_time = 26;
}
