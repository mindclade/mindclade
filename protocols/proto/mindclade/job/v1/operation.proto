syntax = "proto3";

package mindclade.job.v1;

import "google/protobuf/timestamp.proto";
import "proto/mindclade/artifact/v1/artifact_reference.proto";
import "proto/mindclade/common/v1/error_detail.proto";

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/job/v1;jobv1";

enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_PENDING = 1;
  OPERATION_STATE_RUNNING = 2;
  OPERATION_STATE_SUCCEEDED = 3;
  OPERATION_STATE_FAILED = 4;
  OPERATION_STATE_CANCELLING = 5;
  OPERATION_STATE_CANCELLED = 6;
}

// Client-visible long-running command record.
message Operation {
  string operation_id = 1;
  string tenant_id = 2;
  OperationState state = 3;
  int64 resource_version = 4;
  mindclade.artifact.v1.ArtifactRef result = 5;
  mindclade.common.v1.ErrorDetail error = 6;
  string project_id = 7;
  string job_id = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  bool done = 11;
  string etag = 12;
}
