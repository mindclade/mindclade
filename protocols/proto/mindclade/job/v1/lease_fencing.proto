syntax = "proto3";

package mindclade.job.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/job/v1;jobv1";

// Lease fencing receipt required for worker completion acceptance.
message LeaseFence {
  string job_id = 1;
  string run_id = 2;
  string attempt_id = 3;
  uint64 lease_epoch = 4;
  google.protobuf.Timestamp deadline = 5;
  string tenant_id = 6;
  string project_id = 7;
  string lease_token_digest = 8;
}
