syntax = "proto3";

package mindclade.job.v1;

import "google/protobuf/timestamp.proto";
import "proto/mindclade/artifact/v1/artifact_reference.proto";

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/job/v1;jobv1";

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_ACCEPTED = 1;
  JOB_STATE_QUEUED = 2;
  JOB_STATE_RUNNING = 3;
  JOB_STATE_SUCCEEDED = 4;
  JOB_STATE_FAILED = 5;
  JOB_STATE_CANCELLING = 6;
  JOB_STATE_CANCELLED = 7;
}

// Durable admitted work and policy/accounting boundary.
message Job {
  string job_id = 1;
  string operation_id = 2;
  string tenant_id = 3;
  JobState state = 4;
  int64 resource_version = 5;
  string policy_digest = 6;
  string project_id = 7;
  string job_kind = 8;
  mindclade.artifact.v1.ArtifactRef input = 9;
  mindclade.artifact.v1.ArtifactRef configuration = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  string etag = 13;
}
