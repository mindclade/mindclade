syntax = "proto3";

package mindclade.job.v1;

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/mindclade/job/v1;jobv1";

// Durable admitted work and policy/accounting boundary.
message Job {
  string job_id = 1;
  string operation_id = 2;
  string tenant_id = 3;
  string state = 4;
  int64 resource_version = 5;
  string policy_digest = 6;
}
