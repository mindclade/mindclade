syntax = "proto3";

package mindclade.transform.v1;

import "google/protobuf/timestamp.proto";
import "proto/mindclade/artifact/v1/artifact_reference.proto";
import "proto/mindclade/common/v1/command_context.proto";
import "proto/mindclade/common/v1/error_detail.proto";
import "proto/mindclade/common/v1/resource_reference.proto";
import "proto/mindclade/job/v1/lease_fencing.proto";
import "proto/mindclade/transform/v1/transform_execution.proto";

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/transform/v1;transformv1";

// TransformSchedulingHint is a bounded, advisory execution hint with no semantic meaning.
message TransformSchedulingHint {
  string key = 1;
  string value = 2;
}

// ExecuteTransformCommand dispatches fenced work using an immutable execution plan.
message ExecuteTransformCommand {
  mindclade.common.v1.CommandContext context = 1;
  mindclade.common.v1.ResourceRef project = 2;
  string execution_id = 3;
  mindclade.artifact.v1.ArtifactRef execution_plan = 4;
  mindclade.job.v1.LeaseFence fence = 5;
  google.protobuf.Timestamp deadline = 6;
  mindclade.common.v1.ResourceRef delegated_capability = 7;
  repeated TransformSchedulingHint scheduling_hints = 8;
}

// CommitTransformExecutionCommand reconciles one fenced terminal worker result.
message CommitTransformExecutionCommand {
  mindclade.common.v1.CommandContext context = 1;
  string execution_name = 2;
  mindclade.job.v1.LeaseFence fence = 3;
  TransformExecutionTerminalClassification classification = 4;
  mindclade.artifact.v1.ArtifactRef receipt = 5;
  repeated mindclade.artifact.v1.ArtifactRef output_refs = 6;
  mindclade.artifact.v1.ArtifactRef lineage_map = 7;
  mindclade.common.v1.ErrorDetail error = 8;
  google.protobuf.Timestamp completed_at = 9;
}

// CancelTransformExecutionCommand requests cancellation without bypassing fencing.
message CancelTransformExecutionCommand {
  mindclade.common.v1.CommandContext context = 1;
  string execution_name = 2;
  string etag = 3;
  string reason = 4;
}
