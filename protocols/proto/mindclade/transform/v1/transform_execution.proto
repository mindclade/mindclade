syntax = "proto3";

package mindclade.transform.v1;

import "google/protobuf/timestamp.proto";
import "proto/mindclade/artifact/v1/artifact_reference.proto";
import "proto/mindclade/common/v1/error_detail.proto";
import "proto/mindclade/job/v1/lease_fencing.proto";

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/transform/v1;transformv1";

// TransformExecutionState is the durable lifecycle of a planned transform execution.
enum TransformExecutionState {
  TRANSFORM_EXECUTION_STATE_UNSPECIFIED = 0;
  TRANSFORM_EXECUTION_STATE_ACCEPTED = 1;
  TRANSFORM_EXECUTION_STATE_RUNNING = 2;
  TRANSFORM_EXECUTION_STATE_SUCCEEDED = 3;
  TRANSFORM_EXECUTION_STATE_FAILED = 4;
  TRANSFORM_EXECUTION_STATE_CANCELLED = 5;
  TRANSFORM_EXECUTION_STATE_QUARANTINED = 6;
}

// TransformExecutionTerminalClassification describes an immutable terminal outcome.
enum TransformExecutionTerminalClassification {
  TRANSFORM_EXECUTION_TERMINAL_CLASSIFICATION_UNSPECIFIED = 0;
  TRANSFORM_EXECUTION_TERMINAL_CLASSIFICATION_SUCCEEDED = 1;
  TRANSFORM_EXECUTION_TERMINAL_CLASSIFICATION_INVALID_INPUT = 2;
  TRANSFORM_EXECUTION_TERMINAL_CLASSIFICATION_SCHEMA_MISMATCH = 3;
  TRANSFORM_EXECUTION_TERMINAL_CLASSIFICATION_SEMANTIC_VALIDATION_FAILED = 4;
  TRANSFORM_EXECUTION_TERMINAL_CLASSIFICATION_POLICY_DENIED = 5;
  TRANSFORM_EXECUTION_TERMINAL_CLASSIFICATION_RESOURCE_EXHAUSTED = 6;
  TRANSFORM_EXECUTION_TERMINAL_CLASSIFICATION_TRANSIENT_IO = 7;
  TRANSFORM_EXECUTION_TERMINAL_CLASSIFICATION_IMPLEMENTATION_FAILURE = 8;
  TRANSFORM_EXECUTION_TERMINAL_CLASSIFICATION_DETERMINISM_VIOLATION = 9;
  TRANSFORM_EXECUTION_TERMINAL_CLASSIFICATION_CARDINALITY_VIOLATION = 10;
  TRANSFORM_EXECUTION_TERMINAL_CLASSIFICATION_ORDERING_VIOLATION = 11;
  TRANSFORM_EXECUTION_TERMINAL_CLASSIFICATION_LINEAGE_VIOLATION = 12;
  TRANSFORM_EXECUTION_TERMINAL_CLASSIFICATION_CANCELLED = 13;
  TRANSFORM_EXECUTION_TERMINAL_CLASSIFICATION_DEADLINE_EXCEEDED = 14;
  TRANSFORM_EXECUTION_TERMINAL_CLASSIFICATION_STALE_FENCE = 15;
}

// TransformExecution tracks control state while graphs, data, and receipts remain artifacts.
message TransformExecution {
  string name = 1;
  string uid = 2;
  int64 revision = 3;
  string etag = 4;
  string tenant_name = 5;
  string project_name = 6;
  TransformExecutionState state = 7;
  mindclade.artifact.v1.ArtifactRef execution_plan = 8;
  mindclade.job.v1.LeaseFence active_fence = 9;
  mindclade.artifact.v1.ArtifactRef receipt = 10;
  repeated mindclade.artifact.v1.ArtifactRef output_refs = 11;
  mindclade.artifact.v1.ArtifactRef lineage_map = 12;
  mindclade.common.v1.ErrorDetail error = 13;
  string policy_classification = 14;
  google.protobuf.Timestamp create_time = 15;
  google.protobuf.Timestamp start_time = 16;
  google.protobuf.Timestamp complete_time = 17;
}
