syntax = "proto3";

package mindclade.common.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/common/v1;commonv1";

// Context required for every durable mutating command. The canonical request
// digest covers the command with this context omitted so retries are stable.
message CommandContext {
  string request_id = 1;
  string idempotency_key = 2;
  string principal_id = 3;
  string trace_id = 4;
  google.protobuf.Timestamp deadline = 5;
  string canonical_request_digest = 6;
  string tenant_id = 7;
  string project_id = 8;
  string correlation_id = 9;
  string causation_id = 10;
  string cancellation_token_id = 11;
}
