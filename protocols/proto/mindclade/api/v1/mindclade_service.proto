syntax = "proto3";

package mindclade.api.v1;

import "google/api/annotations.proto";
import "google/protobuf/descriptor.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/api/v1;apiv1";

// StreamProjection names the explicit HTTP representation of a streaming RPC.
enum StreamProjection {
  STREAM_PROJECTION_UNSPECIFIED = 0;
  STREAM_PROJECTION_NONE = 1;
  STREAM_PROJECTION_BINARY = 2;
  STREAM_PROJECTION_SSE = 3;
}

// PublicHttpContract records HTTP facts not represented by google.api.http.
message PublicHttpContract {
  repeated uint32 success_status = 1;
  bool bearer_auth = 2;
  repeated string request_headers = 3;
  repeated string response_headers = 4;
  StreamProjection stream = 5;
  repeated uint32 non_success_status = 6;
  bool request_body_required = 7;
  repeated string required_request_headers = 8;
}

// PublicStringEnumContract makes a curated string enumeration descriptor-visible.
message PublicStringEnumContract {
  string field = 1;
  repeated string values = 2;
}

// PublicMessageContract records requiredness and string enums used by ProtoJSON.
message PublicMessageContract {
  repeated string required_fields = 1;
  repeated PublicStringEnumContract string_enums = 2;
}

extend google.protobuf.MethodOptions {
  PublicHttpContract public_http = 51001;
}

extend google.protobuf.MessageOptions {
  PublicMessageContract public_message = 51002;
}

// ResourceRef is the only cross-domain identity exposed by the public API.
message ResourceRef {
  option (public_message) = {
    required_fields: "name"
    required_fields: "uid"
    required_fields: "revision"
  };

  string name = 1;
  string uid = 2;
  uint64 revision = 3;
}

// ArtifactRef identifies immutable content without a provider or storage locator.
message ArtifactRef {
  option (public_message) = {
    required_fields: "digest"
    required_fields: "media_type"
    required_fields: "size_bytes"
    required_fields: "artifact_kind"
  };

  string digest = 1;
  string media_type = 2;
  uint64 size_bytes = 3;
  string artifact_kind = 4;
  string schema_id = 5;
  string integrity_digest = 6;
}

// EvidenceRef identifies public qualification evidence by digest.
message EvidenceRef {
  string digest = 1;
  string subject_digest = 2;
  string evidence_kind = 3;
  string policy_digest = 4;
}

// ErrorDetail carries bounded, non-secret error context.
message ErrorDetail {
  option (public_message) = {
    required_fields: "kind"
    string_enums: {
      field: "kind"
      values: "fieldViolation"
      values: "resource"
      values: "precondition"
      values: "policy"
      values: "quota"
      values: "conflict"
    }
  };

  string kind = 1;
  string field = 2;
  string reason = 3;
  ResourceRef resource = 4;
  uint64 current_revision = 5;
  string limit_name = 6;
}

// PublicError is a sanitized error and never contains internal payloads.
message PublicError {
  option (public_message) = {
    required_fields: "code"
    required_fields: "message"
    required_fields: "request_id"
    required_fields: "retryable"
    string_enums: {
      field: "code"
      values: "AUTHENTICATION_REQUIRED"
      values: "PERMISSION_DENIED"
      values: "INVALID_ARGUMENT"
      values: "FAILED_PRECONDITION"
      values: "NOT_FOUND"
      values: "CONFLICT"
      values: "RATE_LIMITED"
      values: "QUOTA_EXCEEDED"
      values: "UNAVAILABLE"
      values: "DEADLINE_EXCEEDED"
      values: "CANCELLED"
      values: "INTERNAL"
    }
  };

  string code = 1;
  string message = 2;
  string request_id = 3;
  string trace_id = 4;
  bool retryable = 5;
  string retry_after = 6;
  string diagnostic_ref = 7;
  repeated ErrorDetail details = 8;
}

// PageMetadata returns opaque continuation state.
message PageMetadata {
  string next_page_token = 1;
  string snapshot_token = 2;
}

// OperationResult exposes typed summaries and immutable references, never Any.
message OperationResult {
  ResourceRef resource = 1;
  InferenceResultView inference = 2;
  ArtifactRef manifest = 3;
  repeated ArtifactRef artifacts = 4;
}

// Operation is the public long-running-operation view.
message Operation {
  option (public_message) = {
    required_fields: "name"
    required_fields: "uid"
    required_fields: "revision"
    required_fields: "etag"
    required_fields: "state"
    required_fields: "done"
    required_fields: "create_time"
    required_fields: "update_time"
    string_enums: {
      field: "state"
      values: "PENDING"
      values: "RUNNING"
      values: "SUCCEEDED"
      values: "FAILED"
      values: "CANCELLING"
      values: "CANCELLED"
    }
  };

  string name = 1;
  string uid = 2;
  uint64 revision = 3;
  string etag = 4;
  string state = 5;
  bool done = 6;
  google.protobuf.Timestamp create_time = 7;
  google.protobuf.Timestamp update_time = 8;
  ResourceRef target = 9;
  OperationResult result = 10;
  PublicError error = 11;
}

// OperationEvent is serialized as one server-sent event.
message OperationEvent {
  option (public_message) = {
    required_fields: "event_id"
    required_fields: "event_type"
    required_fields: "schema_version"
    required_fields: "resume_cursor"
    required_fields: "emitted_at"
    string_enums: {
      field: "event_type"
      values: "operation.updated"
      values: "operation.terminal"
      values: "heartbeat"
    }
  };

  string event_id = 1;
  Operation operation = 2;
  string event_type = 3;
  uint32 schema_version = 4;
  uint64 operation_revision = 5;
  string resume_cursor = 6;
  bool heartbeat = 7;
  google.protobuf.Timestamp emitted_at = 8;
}

// CancellationRequest is the public cancellation body.
message CancellationRequest {
  option (public_message) = {required_fields: "reason"};

  string reason = 1;
}

// ArtifactView is safe metadata for content download and verification.
message ArtifactView {
  string name = 1;
  string uid = 2;
  google.protobuf.Timestamp create_time = 3;
  string policy_classification = 4;
  ArtifactRef ref = 5;
}

// DownloadArtifactChunk is one verified segment of a binary download.
message DownloadArtifactChunk {
  uint64 offset = 1;
  bytes data = 2;
  uint64 total_size_bytes = 3;
  string content_digest = 4;
  bool complete = 5;
}

// DatasetCreate is public dataset creation intent.
message DatasetCreate {
  string dataset_id = 1;
  string display_name = 2;
  map<string, string> labels = 3;
  map<string, string> annotations = 4;
  string policy_classification = 5;
}

