syntax = "proto3";

package mindclade.api.v1;

import "google/api/annotations.proto";
import "google/protobuf/descriptor.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/mindclade/mindclade/protocols/generated/go/api/v1;apiv1";

// StreamProjection names the explicit HTTP representation of a streaming RPC.
enum StreamProjection {
  STREAM_PROJECTION_UNSPECIFIED = 0;
  STREAM_PROJECTION_NONE = 1;
  STREAM_PROJECTION_BINARY = 2;
  STREAM_PROJECTION_SSE = 3;
}

// PublicHttpContract records HTTP facts not represented by google.api.http.
message PublicHttpContract {
  repeated uint32 success_status = 1;
  bool bearer_auth = 2;
  repeated string request_headers = 3;
  repeated string response_headers = 4;
  StreamProjection stream = 5;
}

extend google.protobuf.MethodOptions {
  PublicHttpContract public_http = 51001;
}

// ResourceRef is the only cross-domain identity exposed by the public API.
message ResourceRef {
  string name = 1;
  string uid = 2;
  uint64 revision = 3;
}

// ArtifactRef identifies immutable content without a provider or storage locator.
message ArtifactRef {
  string digest = 1;
  string media_type = 2;
  uint64 size_bytes = 3;
  string artifact_kind = 4;
  string schema_id = 5;
  string integrity_digest = 6;
}

// EvidenceRef identifies public qualification evidence by digest.
message EvidenceRef {
  string digest = 1;
  string subject_digest = 2;
  string evidence_kind = 3;
  string policy_digest = 4;
}

// ErrorDetail carries bounded, non-secret error context.
message ErrorDetail {
  string kind = 1;
  string field = 2;
  string reason = 3;
  ResourceRef resource = 4;
  uint64 current_revision = 5;
  string limit_name = 6;
}

// PublicError is a sanitized error and never contains internal payloads.
message PublicError {
  string code = 1;
  string message = 2;
  string request_id = 3;
  string trace_id = 4;
  bool retryable = 5;
  string retry_after = 6;
  string diagnostic_ref = 7;
  repeated ErrorDetail details = 8;
}

// PageMetadata returns opaque continuation state.
message PageMetadata {
  string next_page_token = 1;
  string snapshot_token = 2;
}

// OperationResult exposes typed summaries and immutable references, never Any.
message OperationResult {
  ResourceRef resource = 1;
  InferenceResultView inference = 2;
  ArtifactRef manifest = 3;
  repeated ArtifactRef artifacts = 4;
}

// Operation is the public long-running-operation view.
message Operation {
  string name = 1;
  string uid = 2;
  uint64 revision = 3;
  string etag = 4;
  string state = 5;
  bool done = 6;
  google.protobuf.Timestamp create_time = 7;
  google.protobuf.Timestamp update_time = 8;
  ResourceRef target = 9;
  OperationResult result = 10;
  PublicError error = 11;
}

// OperationEvent is serialized as one server-sent event.
message OperationEvent {
  string event_id = 1;
  Operation operation = 2;
}

// CancellationRequest is the public cancellation body.
message CancellationRequest {
  string reason = 1;
}

// ArtifactView is safe metadata for content download and verification.
message ArtifactView {
  string name = 1;
  string uid = 2;
  google.protobuf.Timestamp create_time = 3;
  string policy_classification = 4;
  ArtifactRef ref = 5;
}

// DownloadArtifactChunk is one verified segment of a binary download.
message DownloadArtifactChunk {
  uint64 offset = 1;
  bytes data = 2;
  uint64 total_size_bytes = 3;
  string content_digest = 4;
  bool complete = 5;
}

// DatasetCreate is public dataset creation intent.
message DatasetCreate {
  string dataset_id = 1;
  string display_name = 2;
  map<string, string> labels = 3;
  map<string, string> annotations = 4;
  string policy_classification = 5;
}

// DatasetUpdate is merge-patchable public dataset state.
message DatasetUpdate {
  optional string display_name = 1;
  map<string, string> labels = 2;
  map<string, string> annotations = 3;
}

// DatasetView is distinct from the internal dataset aggregate.
message DatasetView {
  string name = 1;
  string uid = 2;
  uint64 revision = 3;
  string etag = 4;
  google.protobuf.Timestamp create_time = 5;
  google.protobuf.Timestamp update_time = 6;
  string display_name = 7;
  map<string, string> labels = 8;
  map<string, string> annotations = 9;
  string policy_classification = 10;
  string state = 11;
  ResourceRef current_release = 12;
  google.protobuf.Timestamp delete_time = 13;
}

// DatasetList is a stable page of public dataset views.
message DatasetList {
  repeated DatasetView datasets = 1;
  PageMetadata page = 2;
}

// DatasetReleaseCreate is immutable public release intent.
message DatasetReleaseCreate {
  string release_id = 1;
  ArtifactRef manifest = 2;
  repeated EvidenceRef qualification_evidence = 3;
  ResourceRef parent_release = 4;
  ResourceRef use_policy = 5;
  string policy_classification = 6;
}

// DatasetReleaseView is distinct from the internal release aggregate.
message DatasetReleaseView {
  string name = 1;
  string uid = 2;
  uint64 revision = 3;
  string etag = 4;
  google.protobuf.Timestamp create_time = 5;
  ResourceRef dataset = 6;
  string release_id = 7;
  string state = 8;
  ArtifactRef manifest = 9;
  repeated EvidenceRef qualification_evidence = 10;
  string policy_classification = 11;
  google.protobuf.Timestamp update_time = 12;
  google.protobuf.Timestamp delete_time = 13;
}

// DatasetReleaseList is a stable page of public release views.
message DatasetReleaseList {
  repeated DatasetReleaseView releases = 1;
  PageMetadata page = 2;
}

// ModelCreate is public model creation intent.
message ModelCreate {
  string model_id = 1;
  string display_name = 2;
  map<string, string> labels = 3;
  map<string, string> annotations = 4;
  string policy_classification = 5;
  string family = 6;
  ArtifactRef definition_manifest = 7;
  ArtifactRef input_contract = 8;
  ArtifactRef output_contract = 9;
}

// ModelUpdate is merge-patchable public model state.
message ModelUpdate {
  optional string display_name = 1;
  map<string, string> labels = 2;
  map<string, string> annotations = 3;
}

// ModelView is distinct from the internal model aggregate.
message ModelView {
  string name = 1;
  string uid = 2;
  uint64 revision = 3;
  string etag = 4;
  google.protobuf.Timestamp create_time = 5;
  google.protobuf.Timestamp update_time = 6;
  string display_name = 7;
  map<string, string> labels = 8;
  map<string, string> annotations = 9;
  string policy_classification = 10;
  string family = 11;
  string state = 12;
  ArtifactRef definition_manifest = 13;
  ArtifactRef input_contract = 14;
  ArtifactRef output_contract = 15;
  ResourceRef current_release = 16;
  google.protobuf.Timestamp delete_time = 17;
}

// ModelList is a stable page of public model views.
message ModelList {
  repeated ModelView models = 1;
  PageMetadata page = 2;
}

// ModelReleaseCreate is immutable public model-release intent.
message ModelReleaseCreate {
  string release_id = 1;
  ArtifactRef bundle_manifest = 2;
  ArtifactRef model_manifest = 3;
  ResourceRef checkpoint = 4;
  repeated EvidenceRef evaluation_evidence = 5;
  ResourceRef release_policy = 6;
  string policy_classification = 7;
}

// ModelReleaseView is distinct from the internal release aggregate.
message ModelReleaseView {
  string name = 1;
  string uid = 2;
  uint64 revision = 3;
  string etag = 4;
  google.protobuf.Timestamp create_time = 5;
  ResourceRef model = 6;
  string release_id = 7;
  string stage = 8;
  ArtifactRef bundle_manifest = 9;
  ArtifactRef model_manifest = 10;
  ResourceRef checkpoint = 11;
  repeated EvidenceRef evaluation_evidence = 12;
  string policy_classification = 13;
  google.protobuf.Timestamp update_time = 14;
  google.protobuf.Timestamp delete_time = 15;
}

// ModelReleaseList is a stable page of public model-release views.
message ModelReleaseList {
  repeated ModelReleaseView releases = 1;
  PageMetadata page = 2;
}

// TrainingRunCreate excludes executable plans; admission resolves them internally.
message TrainingRunCreate {
  string training_run_id = 1;
  ArtifactRef training_recipe = 2;
  ResourceRef dataset_release = 3;
  ResourceRef model_release = 4;
  ArtifactRef hardware_topology = 5;
  ResourceRef use_policy = 6;
  map<string, string> labels = 7;
  string policy_classification = 8;
}

// TrainingRunView is a non-executable public training status summary.
message TrainingRunView {
  string name = 1;
  string uid = 2;
  uint64 revision = 3;
  string etag = 4;
  google.protobuf.Timestamp create_time = 5;
  google.protobuf.Timestamp update_time = 6;
  string state = 7;
  ArtifactRef training_recipe = 8;
  ResourceRef dataset_release = 9;
  ResourceRef model_release = 10;
  ArtifactRef hardware_topology = 11;
  ResourceRef latest_checkpoint = 12;
  ArtifactRef result_manifest = 13;
  PublicError failure = 14;
  google.protobuf.Timestamp delete_time = 15;
}

// TrainingRunList is a stable page of public training views.
message TrainingRunList {
  repeated TrainingRunView training_runs = 1;
  PageMetadata page = 2;
}

// EvaluationRunCreate is public evaluation intent.
message EvaluationRunCreate {
  string evaluation_run_id = 1;
  ArtifactRef suite = 2;
  repeated ArtifactRef datasets = 3;
  ArtifactRef snapshot = 4;
  ResourceRef model_release = 5;
  ArtifactRef inference_protocol = 6;
}

// EvaluationRunView is distinct from the internal evaluation aggregate.
message EvaluationRunView {
  string name = 1;
  string uid = 2;
  uint64 revision = 3;
  string etag = 4;
  google.protobuf.Timestamp create_time = 5;
  google.protobuf.Timestamp update_time = 6;
  string state = 7;
  ArtifactRef suite = 8;
  repeated ArtifactRef datasets = 9;
  ResourceRef model_release = 10;
  uint64 completed_samples = 11;
  uint64 total_samples = 12;
  PublicError failure = 13;
  google.protobuf.Timestamp delete_time = 14;
}

// EvaluationRunList is a stable page of public evaluation views.
message EvaluationRunList {
  repeated EvaluationRunView evaluation_runs = 1;
  PageMetadata page = 2;
}

// MetricSummary is a bounded public metric projection.
message MetricSummary {
  string metric_id = 1;
  string metric_version = 2;
  string unit = 3;
  double value = 4;
  optional double interval_lower = 5;
  optional double interval_upper = 6;
  uint64 valid_count = 7;
  uint64 invalid_count = 8;
}

// EvaluationResultView is immutable public evaluation evidence.
message EvaluationResultView {
  string name = 1;
  string uid = 2;
  ResourceRef run = 3;
  string outcome = 4;
  ArtifactRef report = 5;
  repeated MetricSummary metrics = 6;
  ArtifactRef safety_evidence = 7;
  ArtifactRef statistical_evidence = 8;
  string result_digest = 9;
}

// InferenceOutput describes requested public result artifacts.
message InferenceOutput {
  string result_schema_id = 1;
  repeated string requested_artifact_kinds = 2;
}

// InferenceSubmission is immutable public inference intent.
message InferenceSubmission {
  string request_id = 1;
  string capability = 2;
  ResourceRef model = 3;
  ArtifactRef resolved_model_bundle = 4;
  ArtifactRef input = 5;
  ArtifactRef sampling_policy = 6;
  InferenceOutput output = 7;
  string resource_class = 8;
  string data_classification = 9;
}

// InferenceResultView is immutable public inference output metadata.
message InferenceResultView {
  string name = 1;
  string uid = 2;
  ResourceRef request = 3;
  ResourceRef operation = 4;
  ArtifactRef result_manifest = 5;
  repeated ArtifactRef outputs = 6;
  string result_digest = 7;
}

// AgentBudget bounds one public agent definition.
message AgentBudget {
  uint64 maximum_model_tokens = 1;
  uint32 maximum_iterations = 2;
  uint32 maximum_tool_calls = 3;
  uint64 maximum_external_spend_micros = 4;
}

// AgentDefinitionCreate is public definition intent by immutable reference.
message AgentDefinitionCreate {
  string agent_definition_id = 1;
  string display_name = 2;
