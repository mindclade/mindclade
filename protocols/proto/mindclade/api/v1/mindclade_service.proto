}

// GetResourceRequest identifies a canonical resource; auth identity is metadata.
message GetResourceRequest {
  string name = 1;
}

// ListResourcesRequest carries only public query parameters.
message ListResourcesRequest {
  string parent = 1;
  uint32 page_size = 2;
  string page_token = 3;
  string filter = 4;
  string order_by = 5;
}

// ListChildResourcesRequest carries pagination for immutable child collections.
message ListChildResourcesRequest {
  string parent = 1;
  uint32 page_size = 2;
  string page_token = 3;
}

// SubmitInferenceRequest binds public inference intent below a canonical parent.
message SubmitInferenceRequest {
  string parent = 1;
  InferenceSubmission submission = 2;
}
// CancelOperationRequest binds a public cancellation body to an operation name.
message CancelOperationRequest {
  string name = 1;
  CancellationRequest cancellation = 2;
}
// DownloadArtifactRequest selects an optional half-open byte range.
message DownloadArtifactRequest {
  string name = 1;
}
// WatchOperationRequest resumes after an optional public revision.
message WatchOperationRequest { string name = 1; }
// CreateDatasetRequest binds creation intent below a canonical parent.
message CreateDatasetRequest {
  string parent = 1;
  DatasetCreate dataset = 2;
}
// UpdateDatasetRequest binds a merge patch to a canonical resource name.
message UpdateDatasetRequest {
  string name = 1;
  DatasetUpdate dataset = 2;
}
// CreateDatasetReleaseRequest binds immutable release intent.
message CreateDatasetReleaseRequest {
  string parent = 1;
  DatasetReleaseCreate release = 2;
}
// CreateModelRequest binds model intent below a canonical parent.
message CreateModelRequest {
  string parent = 1;
  ModelCreate model = 2;
}
// UpdateModelRequest binds a merge patch to a canonical resource name.
message UpdateModelRequest {
  string name = 1;
  ModelUpdate model = 2;
}
// CreateModelReleaseRequest binds immutable model-release intent.
message CreateModelReleaseRequest {
  string parent = 1;
  ModelReleaseCreate release = 2;
}
// CreateTrainingRunRequest binds non-executable training intent.
message CreateTrainingRunRequest {
  string parent = 1;
  TrainingRunCreate training_run = 2;
}
// CreateEvaluationRunRequest binds evaluation intent.
message CreateEvaluationRunRequest {
  string parent = 1;
  EvaluationRunCreate evaluation_run = 2;
}
// CreateAgentDefinitionRequest binds definition intent.
message CreateAgentDefinitionRequest {
  string parent = 1;
  AgentDefinitionCreate agent_definition = 2;
}
// CreateAgentRunRequest binds agent-run intent.
message CreateAgentRunRequest {
  string parent = 1;
  AgentRunCreate agent_run = 2;
}
// CreateWorkflowDefinitionRequest binds workflow definition intent.
message CreateWorkflowDefinitionRequest {
  string parent = 1;
  WorkflowDefinitionCreate workflow_definition = 2;
}
// CreateWorkflowRunRequest binds workflow-run intent.
message CreateWorkflowRunRequest {
  string parent = 1;
  WorkflowRunCreate workflow_run = 2;
}
// DecideApprovalRequest binds a decision to a canonical approval name.
message DecideApprovalRequest {
  string name = 1;
  ApprovalDecision approval = 2;
}
// CreateProjectRequest binds project intent below a canonical tenant name.
message CreateProjectRequest {
  string parent = 1;
  ProjectCreate project = 2;
}
// ListAuditRecordsRequest carries the curated audit query surface.
message ListAuditRecordsRequest {
  string parent = 1;
  uint32 page_size = 2;
  string page_token = 3;
  string actor = 4;
  string action = 5;
  string request_id = 6;
}

// MindcladeService is the only public gRPC façade.
service MindcladeService {
  rpc SubmitInference(SubmitInferenceRequest) returns (Operation) {
    option (google.api.http) = {
      post: "/v1/{parent=tenants/*/projects/*}/inferenceOperations"
      body: "submission"
    };
    option (public_http) = {
      success_status: 202
      bearer_auth: true
      request_headers: "Idempotency-Key"
      request_headers: "X-Mindclade-Deadline"
      stream: STREAM_PROJECTION_NONE
    };
  }
  rpc GetOperation(GetResourceRequest) returns (Operation) {
    option (google.api.http) = {get: "/v1/{name=tenants/*/projects/*/operations/*}"};
    option (public_http) = {
      success_status: 200
      bearer_auth: true
      request_headers: "If-None-Match"
      response_headers: "ETag"
      stream: STREAM_PROJECTION_NONE
    };
  }
  rpc CancelOperation(CancelOperationRequest) returns (Operation) {
    option (google.api.http) = {
      post: "/v1/{name=tenants/*/projects/*/operations/*}:cancel"
      body: "cancellation"
    };
    option (public_http) = {
      success_status: 200
      bearer_auth: true
      request_headers: "Idempotency-Key"
      request_headers: "X-Mindclade-Deadline"
      request_headers: "If-Match"
      stream: STREAM_PROJECTION_NONE
    };
  }
  rpc WatchOperation(WatchOperationRequest) returns (stream OperationEvent) {
    option (google.api.http) = {get: "/v1/{name=tenants/*/projects/*/operations/*}:watch"};
    option (public_http) = {
      success_status: 200
      bearer_auth: true
      request_headers: "Last-Event-ID"
      stream: STREAM_PROJECTION_SSE
    };
  }
  rpc GetArtifact(GetResourceRequest) returns (ArtifactView) {
    option (google.api.http) = {get: "/v1/{name=tenants/*/projects/*/artifacts/*}"};
    option (public_http) = {
      success_status: 200
      bearer_auth: true
      request_headers: "If-None-Match"
      response_headers: "ETag"
      stream: STREAM_PROJECTION_NONE
    };
  }
  rpc DownloadArtifact(DownloadArtifactRequest) returns (stream DownloadArtifactChunk) {
    option (google.api.http) = {get: "/v1/{name=tenants/*/projects/*/artifacts/*}:download"};
    option (public_http) = {
      success_status: 200
      success_status: 206
      bearer_auth: true
      request_headers: "Range"
      response_headers: "Content-Range"
      stream: STREAM_PROJECTION_BINARY
    };
  }
  rpc ListDatasets(ListResourcesRequest) returns (DatasetList) {
    option (google.api.http) = {get: "/v1/{parent=tenants/*/projects/*}/datasets"};
    option (public_http) = {
      success_status: 200
      bearer_auth: true
      stream: STREAM_PROJECTION_NONE
    };
  }
  rpc CreateDataset(CreateDatasetRequest) returns (DatasetView) {
    option (google.api.http) = {
      post: "/v1/{parent=tenants/*/projects/*}/datasets"
      body: "dataset"
    };
    option (public_http) = {
      success_status: 201
      bearer_auth: true
      request_headers: "Idempotency-Key"
      stream: STREAM_PROJECTION_NONE
    };
  }
  rpc GetDataset(GetResourceRequest) returns (DatasetView) {
    option (google.api.http) = {get: "/v1/{name=tenants/*/projects/*/datasets/*}"};
