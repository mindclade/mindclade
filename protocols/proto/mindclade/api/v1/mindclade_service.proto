// AgentDefinitionView is a non-executable public definition summary.
message AgentDefinitionView {
  string name = 1;
  string uid = 2;
  uint64 revision = 3;
  string etag = 4;
  google.protobuf.Timestamp create_time = 5;
  google.protobuf.Timestamp update_time = 6;
  string display_name = 7;
  string semantic_version = 8;
  string purpose = 9;
  ArtifactRef definition = 10;
  ResourceRef workflow_definition = 11;
  ArtifactRef input_schema = 12;
  ArtifactRef output_schema = 13;
  AgentBudget budget = 14;
  string state = 15;
  string agent_definition_id = 16;
  google.protobuf.Timestamp delete_time = 17;
}

// AgentDefinitionList is a stable page of public definition views.
message AgentDefinitionList {
  repeated AgentDefinitionView agent_definitions = 1;
  PageMetadata page = 2;
}

// AgentRunCreate is public agent-run intent.
message AgentRunCreate {
  string agent_run_id = 1;
  ResourceRef definition = 2;
  string definition_digest = 3;
  ArtifactRef input = 4;
  ArtifactRef model_provider_manifest = 5;
}

// AgentRunView is distinct from the internal run aggregate.
message AgentRunView {
