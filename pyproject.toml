[project]
name = "mindclade-workspace"
version = "0.0.0"
description = "Private Mindclade monorepo workspace tooling"
requires-python = "==3.12.*"
dependencies = [
  "cryptography==50.0.0",
  "grpcio==1.83.1",
  "grpcio-tools==1.83.1",
  "googleapis-common-protos==1.75.2",
  "jsonschema==4.26.0",
  "mypy-protobuf==5.1.0",
  "protobuf==7.36.0",
  "pyyaml==6.0.3",
  "types-grpcio==1.83.0.20260730",
]

[tool.uv]
package = false
required-version = "==0.12.5"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs/architecture/blueprint/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = [".buildkite", "tools"]
exclude = ["docs/architecture/blueprint/generated"]
extraPaths = [
  "libs/python",
  "protocols/generated/python",
  "tools/ci",
  ".buildkite/lib",
  ".buildkite/steps",
  "tools/docs",
  "tools/repo",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tools"]

[dependency-groups]
dev = [
    "pytest==9.0.3",
]

native-kernels = [
    "tilelang==0.1.13; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch==2.10.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
