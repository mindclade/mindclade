# reviewed workspace dependencies require one, so keep the allowlist closed.
allowBuilds: {}

catalog:
  '@connectrpc/connect': 2.1.2
  '@connectrpc/connect-node': 2.1.2
  '@types/node': 26.4.0
  ajv: 8.20.0
  ajv-formats: 3.0.1
