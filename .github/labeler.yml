architecture:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/architecture/**"
          - "docs/adr/**"
          - "ARCHITECTURE.md"
ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".buildkite/**"
          - ".github/workflows/**"
          - "tools/ci/**"
dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "**/Cargo.lock"
          - "**/go.sum"
          - "**/pnpm-lock.yaml"
          - "**/uv.lock"
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
security:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "SECURITY.md"
          - "tools/licenses/**"
wave-0:
  - changed-files:
      - any-glob-to-any-file: "**"
