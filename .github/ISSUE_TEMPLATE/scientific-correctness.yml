name: Scientific correctness concern
description: Report a reproducibility, lineage, leakage, identity, metric, or numerical-semantic concern.
title: "[scientific-correctness] "
labels: [scientific-correctness, needs-triage]
body:
  - type: markdown
    attributes:
      value: Use synthetic or approved references only. Escalate protected data or biological-safety concerns privately.
  - type: input
    id: subject
    attributes:
      label: Immutable subject
      description: Exact source revision, dataset/model release, or artifact digest.
    validations:
      required: true
  - type: textarea
    id: invariant
    attributes:
      label: Violated scientific invariant
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction and evidence
    validations:
      required: true
  - type: dropdown
    id: safety
    attributes:
      label: Biological-safety review required
      options: [unknown, "yes", "no"]
    validations:
      required: true
