name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "31 6 * * 3"

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-scorecard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    permissions:
      contents: read
      security-events: write
    uses: mindclade/.github/.github/workflows/reusable-scorecard.yml@c097ef86c25991a400050c13e78574e8d3d8c071
    with:
      source_revision: ${{ github.sha }}
