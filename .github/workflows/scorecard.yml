name: OpenSSF Scorecard

on:
  # Scorecard measures repository posture, which changes on the order of weeks.
  # Running it on every merge cost three job allocations and a 30-minute
  # container scan for a signal the weekly cron already captures.
  schedule:
    - cron: "31 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-scorecard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    permissions:
      contents: read
      security-events: write
    uses: mindclade/.github/.github/workflows/reusable-scorecard.yml@55687ae97dbf6073d61a085c21542637a551ed00
    with:
      source_revision: ${{ github.sha }}
