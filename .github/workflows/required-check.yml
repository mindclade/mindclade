name: Pull request

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-required-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    uses: mindclade/.github/.github/workflows/reusable-metadata-validation.yml@cdfc7303e8f14d647528774768c144e4dbf67b86
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      component_path: component.yaml
      required_files: |-
        README.md
        ARCHITECTURE.md
        SECURITY.md
        LICENSE
        component.yaml

  # Documentation validation runs exactly once per pull request, here, driven by
  # the metadata job's classification. It previously ran from a path-filtered
  # standalone workflow and again on the untrusted branch of this graph.
  documentation:
    needs: classify
    if: >-
      needs.classify.result == 'success' &&
      needs.classify.outputs.documentation_changed == 'true'
    uses: mindclade/.github/.github/workflows/reusable-documentation-check.yml@cdfc7303e8f14d647528774768c144e4dbf67b86
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      documentation_roots: |-
        README.md
        docs

  dispatch:
    needs: classify
    if: >-
      needs.classify.result == 'success' &&
      (
        github.event_name != 'pull_request' ||
        needs.classify.outputs.trust_classification == 'trusted'
      )
    uses: mindclade/.github/.github/workflows/reusable-buildkite-dispatch.yml@cdfc7303e8f14d647528774768c144e4dbf67b86
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      pipeline_class: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'presubmit' || github.event_name == 'release' && 'release' || 'protected' }}
    secrets:
      buildkite_dispatch_token: ${{ secrets.MINDCLADE_BUILDKITE_DISPATCH_TOKEN }}
      buildkite_pipeline: ${{ secrets.MINDCLADE_BUILDKITE_PIPELINE }}

  buildkite_required:
    permissions:
      actions: read
      contents: read
      id-token: write
    needs: [classify, dispatch]
    if: needs.dispatch.result == 'success'
    uses: mindclade/.github/.github/workflows/reusable-required-check.yml@cdfc7303e8f14d647528774768c144e4dbf67b86
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      pipeline_definition_revision: ${{ needs.dispatch.outputs.pipeline_definition_revision }}
      build_id: ${{ needs.dispatch.outputs.build_id }}
      build_number: ${{ needs.dispatch.outputs.build_number }}
      correlation_id: ${{ needs.dispatch.outputs.correlation_id }}
      context_digest: ${{ needs.dispatch.outputs.context_digest }}
      archive_evidence: false
    secrets:
      buildkite_cancel_token: ${{ secrets.MINDCLADE_BUILDKITE_CANCEL_TOKEN }}
      buildkite_evidence_token: ${{ secrets.MINDCLADE_BUILDKITE_EVIDENCE_TOKEN }}
      buildkite_pipeline: ${{ secrets.MINDCLADE_BUILDKITE_PIPELINE }}

  required:
    name: required
    needs: [classify, documentation, dispatch, buildkite_required]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      BUILDKITE_REQUIRED_RESULT: ${{ needs.buildkite_required.result }}
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      DISPATCH_RESULT: ${{ needs.dispatch.result }}
      EVENT_NAME: ${{ github.event_name }}
      DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
      TRUST_CLASSIFICATION: ${{ needs.classify.outputs.trust_classification }}
    steps:
      - name: Enforce the event-specific fail-closed path
        run: |
          set -euo pipefail
          [[ "${CLASSIFY_RESULT}" == success ]]
          # Documentation is skipped when this revision changes none, so both
          # success and skipped are acceptable; any other result is a failure.
          case "${DOCUMENTATION_RESULT}" in
            success | skipped) ;;
            *)
              echo "Documentation validation did not complete: ${DOCUMENTATION_RESULT}" >&2
              exit 1
              ;;
          esac
          case "${EVENT_NAME}:${TRUST_CLASSIFICATION}" in
            pull_request:untrusted)
              [[ "${DISPATCH_RESULT}" == skipped ]]
              [[ "${BUILDKITE_REQUIRED_RESULT}" == skipped ]]
              echo "Untrusted code requires maintainer transfer to the isolated Buildkite path" >&2
              exit 1
              ;;
            pull_request:trusted|pull_request:protected|merge_group:protected)
              [[ "${DISPATCH_RESULT}" == success ]]
              [[ "${BUILDKITE_REQUIRED_RESULT}" == success ]]
              ;;
            *)
              exit 1
              ;;
          esac
