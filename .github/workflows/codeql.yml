name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: mindclade/.github/.github/workflows/reusable-codeql.yml@c097ef86c25991a400050c13e78574e8d3d8c071
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      languages: '["python"]'
      build_mode: none
