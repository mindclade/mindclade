name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    permissions:
      contents: read
      security-events: write
    uses: mindclade/.github/.github/workflows/reusable-codeql.yml@fc5af9efc19b47078fe446feee750d7f4973195b
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      languages: '["python"]'
      build_mode: none
