name: Documentation

on:
  # Pull requests reach documentation validation through required-check.yml,
  # which runs it exactly once using the metadata job's documentation_changed
  # classification. This workflow covers protected main only.
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "docs/**"
      - "tools/docs/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    uses: mindclade/.github/.github/workflows/reusable-documentation-check.yml@55687ae97dbf6073d61a085c21542637a551ed00
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      documentation_roots: |-
        README.md
        docs
