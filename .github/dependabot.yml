version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Detroit
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    commit-message:
      prefix: deps(actions)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Detroit
    groups:
      python-runtime:
        patterns: ["*"]
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    commit-message:
      prefix: deps(python)
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Detroit
    groups:
      rust-runtime:
        patterns: ["*"]
    open-pull-requests-limit: 5
    labels: [dependencies, rust]
    commit-message:
      prefix: deps(rust)
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: America/Detroit
    groups:
      go-runtime:
        patterns: ["*"]
    open-pull-requests-limit: 5
    labels: [dependencies, go]
    commit-message:
      prefix: deps(go)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Detroit
    groups:
      node-runtime:
        patterns: ["*"]
    open-pull-requests-limit: 5
    labels: [dependencies, typescript]
    commit-message:
      prefix: deps(node)
