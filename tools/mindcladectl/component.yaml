apiVersion: mindclade.dev/v1
kind: Component
metadata:
  name: tools-mindcladectl
  description: Bounded administrative CLI over the private Mindclade SDK.
spec:
  type: internal-cli
  lifecycle: pre-production
  maturity: internal
  owner: developer-platform
  security_reviewers:
    - security
  repository_class: application-source
  trust_tier: client
  recovery_tier: tier-2
  data_classification: internal
  production_authority: false
  dependencies:
    - component: internal-sdk-go
      kind: compile-api
      visibility: repository
      owner: developer-experience
      justification: The CLI uses the governed ergonomic Go facade over generated transports.
      scope: bounded operation administration and verified artifact download
  provides:
    - operation-administration
    - verified-artifact-download
  release:
    strategy: source-only
    artifact: null
    immutable: false
  activation:
    wave: guide-only
    connected: false
status:
  readiness: IMPLEMENTED
  source_readiness: SOURCE_IMPLEMENTED
