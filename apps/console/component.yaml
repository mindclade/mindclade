apiVersion: mindclade.dev/v1
kind: Component
metadata:
  name: apps-internal-console-client
  description: Server-side internal console data source consuming the private TypeScript SDK.
spec:
  type: application
  lifecycle: pre-production
  maturity: internal
  owner: developer-platform
  security_reviewers:
    - security
  repository_class: application-source
  trust_tier: service
  recovery_tier: tier-2
  data_classification: internal
  production_authority: false
  dependencies:
    - internal-sdk-typescript
  provides:
    - console-operation-and-artifact-data-source
  release:
    strategy: source-only
    artifact: null
    immutable: false
  activation:
    wave: guide-only
    connected: false
status:
  readiness: IMPLEMENTED
  source_readiness: SOURCE_IMPLEMENTED
