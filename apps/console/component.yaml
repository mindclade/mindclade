apiVersion: mindclade.dev/v1
kind: Component
metadata:
  name: apps-console
  description: Server-side internal console data source consuming the private TypeScript SDK.
spec:
  type: application
  lifecycle: pre-production
  maturity: internal
  owner: product-engineering
  security_reviewers:
    - security
  repository_class: application-source
  trust_tier: service
  recovery_tier: tier-2
  data_classification: internal
  production_authority: false
  dependencies:
    - component: internal-sdk-typescript
      kind: compile-api
      visibility: repository
      owner: developer-experience
      justification: The console uses the governed ergonomic TypeScript facade over generated transports.
      scope: operation and verified-artifact client calls
  provides:
    - console-operation-and-artifact-data-source
  release:
    strategy: source-only
    artifact: null
    immutable: false
  activation:
    wave: guide-only
    connected: false
status:
  readiness: IMPLEMENTED
  source_readiness: SOURCE_IMPLEMENTED
